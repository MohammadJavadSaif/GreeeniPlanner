[package]
name = "greeniplanner"
version = "1.2.1"
description = "GreeniPlanner — Goal & Task Manager"
authors = ["GreeniAI"]
license = "UNLICENSED"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "greeniplanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
# Maximum size & speed optimization — applies to all platforms
# (Windows, macOS, Android). panic="abort" is standard practice in Tauri's
# own official mobile templates and works fine with the NDK versions
# Tauri's mobile tooling requires (r23+).
opt-level = "z"        # optimize for size (smaller than "s", faster than "3" on small binaries)
lto = true             # link-time optimization — merges dead code across crates
codegen-units = 1      # single codegen unit = better LTO, slower compile but smaller output
panic = "abort"        # removes panic unwinding machinery (~saves 10-20kb)
strip = true           # strip debug symbols from final binary
