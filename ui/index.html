// ── SHARED CALENDAR POPOVER BUILDER ───────────────────────────────────────
// Builds a full calendar popover into `container` with:
//   - Clickable month name  → shows month-picker grid
//   - Clickable year number → shows year-picker grid
//   - Optional footer (Today / Clear) controlled by `opts`
// opts: { popId, selected, todayFn, onSelect, onClear, footerButtons, rightAlign }
function _buildCalPop(container, viewY, viewM, opts) {
  // remove existing pop
  const old = document.getElementById(opts.popId);
  if (old) old.remove();

  const todayStr = opts.todayFn ? opts.todayFn() : (() => {
    const t = new Date();
    return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  })();

  function fmtDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  const pop = document.createElement('div');
  pop.className = 'cal-pop';
  pop.id = opts.popId;
  // Portal to <body> so the popover is never clipped by a scrolling ancestor
  // (e.g. the modal body). Position is calculated in screen coordinates.
  pop.style.position = 'fixed';
  document.body.appendChild(pop);

  function _repositionPop() {
    const anchor = container.getBoundingClientRect();
    const popRect = pop.getBoundingClientRect();
    const popHeight = popRect.height || 320;
    const popWidth  = popRect.width  || 270;
    const viewportH = window.innerHeight;
    const viewportW = window.innerWidth;

    const spaceBelow = viewportH - anchor.bottom;
    const spaceAbove = anchor.top;

    let top;
    if (spaceBelow >= popHeight || spaceBelow >= spaceAbove) {
      top = anchor.bottom + 4;
    } else {
      top = anchor.top - popHeight - 4;
    }
    top = Math.max(8, Math.min(top, viewportH - popHeight - 8));

    let left = opts.rightAlign ? (anchor.right - popWidth) : anchor.left;
    left = Math.max(8, Math.min(left, viewportW - popWidth - 8));

    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
  }

  const _onReflow = () => _repositionPop();
  window.addEventListener('resize', _onReflow);
  window.addEventListener('scroll', _onReflow, true);
  const _origRemove = pop.remove.bind(pop);
  pop.remove = () => {
    window.removeEventListener('resize', _onReflow);
    window.removeEventListener('scroll', _onReflow, true);
    _origRemove();
  };

  function renderDayView() {
    // All calendar maths now go through the active calendar system
    const todayDisplay  = _todayDisplay();
    const totalDays     = _daysInMonth(viewY, viewM);
    const firstWeekday  = _firstDayOfMonth(viewY, viewM);
    const mNames        = _monthNames(false);
    const dowLabels     = _dowLabels();
    const selectedDisp  = opts.selected ? _gregToDisplay(opts.selected) : null;

    let cells = '';
    // leading empty cells (previous month days)
    for (let i = 0; i < firstWeekday; i++) cells += `<div class="cal-day muted"></div>`;
    for (let d = 1; d <= totalDays; d++) {
      // convert display date → Gregorian string for data-date (storage format never changes)
      const gregStr = _displayToGreg(viewY, viewM, d);
      const cls = ['cal-day'];
      if (todayDisplay && d === todayDisplay.d && viewM === todayDisplay.m && viewY === todayDisplay.y)
        cls.push('today');
      if (selectedDisp && d === selectedDisp.d && viewM === selectedDisp.m && viewY === selectedDisp.y)
        cls.push('selected');
      cells += `<div class="${cls.join(' ')}" data-date="${gregStr}">${d}</div>`;
    }

    const footerHTML = opts.footerButtons ? `
      <div class="cal-pop-foot">
        ${opts.footerButtons.map(b => `<button type="button" class="cal-text-btn" data-calfoot="${b.key}">${b.label}</button>`).join('')}
      </div>` : '';

    pop.innerHTML = `
      <div class="cal-pop-head">
        <button type="button" class="cal-nav-btn" data-calnav="prev">◀</button>
        <div class="cal-pop-month">
          <button type="button" class="cal-pick-btn" data-calpick="month">${mNames[viewM - 1]}</button>
          <button type="button" class="cal-pick-btn" data-calpick="year">${viewY}</button>
        </div>
        <button type="button" class="cal-nav-btn" data-calnav="next">▶</button>
      </div>
      <div class="cal-grid">
        ${dowLabels.map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      ${footerHTML}`;

    pop.querySelectorAll('.cal-day[data-date]').forEach(el => {
      el.onclick = e => { e.stopPropagation(); opts.onSelect(el.dataset.date); };
    });
    pop.querySelector('[data-calnav="prev"]').onclick = e => {
      e.stopPropagation(); viewM--; if (viewM < 1) { viewM = 12; viewY--; } renderDayView();
    };
    pop.querySelector('[data-calnav="next"]').onclick = e => {
      e.stopPropagation(); viewM++; if (viewM > 12) { viewM = 1; viewY++; } renderDayView();
    };
    pop.querySelector('[data-calpick="month"]').onclick = e => { e.stopPropagation(); renderMonthPicker(); };
    pop.querySelector('[data-calpick="year"]').onclick  = e => { e.stopPropagation(); renderYearPicker(); };
    if (opts.footerButtons) {
      opts.footerButtons.forEach(b => {
        const el = pop.querySelector(`[data-calfoot="${b.key}"]`);
        if (el) el.onclick = e => { e.stopPropagation(); b.action(); };
      });
    }
    _repositionPop();
  }

  function renderMonthPicker() {
    const todayDisp = _todayDisplay();
    const mShort = _monthNames(true);
    pop.innerHTML = `
      <div class="cal-pop-head">
        <button type="button" class="cal-nav-btn" data-calnav="year-prev">◀</button>
        <div class="cal-pop-month">
          <button type="button" class="cal-pick-btn" data-calpick="year">${viewY}</button>
        </div>
        <button type="button" class="cal-nav-btn" data-calnav="year-next">▶</button>
      </div>
      <div class="cal-month-grid">
        ${mShort.map((m, i) => {
          const mn = i + 1;
          const cls = ['cal-month-cell'];
          if (mn === viewM) cls.push('selected');
          if (todayDisp && mn === todayDisp.m && viewY === todayDisp.y) cls.push('current');
          return `<div class="${cls.join(' ')}" data-pickmonth="${mn}">${m}</div>`;
        }).join('')}
      </div>`;

    pop.querySelectorAll('[data-pickmonth]').forEach(el => {
      el.onclick = e => {
        e.stopPropagation();
        viewM = parseInt(el.dataset.pickmonth);
        renderDayView();
      };
    });
    pop.querySelector('[data-calnav="year-prev"]').onclick = e => {
      e.stopPropagation(); viewY--; renderMonthPicker();
    };
    pop.querySelector('[data-calnav="year-next"]').onclick = e => {
      e.stopPropagation(); viewY++; renderMonthPicker();
    };
    pop.querySelector('[data-calpick="year"]').onclick = e => {
      e.stopPropagation(); renderYearPicker();
    };
    _repositionPop();
  }

  function renderYearPicker() {
    const nowY = new Date().getFullYear();
    // show a range of 12 years centred around viewY
    const startY = viewY - 5;
    let years = '';
    for (let y = startY; y < startY + 12; y++) {
      const cls = ['cal-year-cell'];
      if (y === viewY) cls.push('selected');
      if (y === nowY)  cls.push('current');
      years += `<div class="${cls.join(' ')}" data-pickyear="${y}">${y}</div>`;
    }
    pop.innerHTML = `
      <div class="cal-pop-head">
        <button type="button" class="cal-nav-btn" data-calnav="ydec">◀</button>
        <div class="cal-pop-month">
          <span style="font-size:11px;color:var(--ink3)">Select Year</span>
        </div>
        <button type="button" class="cal-nav-btn" data-calnav="yinc">▶</button>
      </div>
      <div class="cal-year-grid">${years}</div>`;

    pop.querySelectorAll('[data-pickyear]').forEach(el => {
      el.onclick = e => {
        e.stopPropagation();
        viewY = parseInt(el.dataset.pickyear);
        renderDayView();
      };
    });
    pop.querySelector('[data-calnav="ydec"]').onclick = e => {
      e.stopPropagation();
      // shift the window back 12 years — re-render with adjusted viewY
      viewY -= 12; renderYearPicker();
    };
    pop.querySelector('[data-calnav="yinc"]').onclick = e => {
      e.stopPropagation();
      viewY += 12; renderYearPicker();
    };
    _repositionPop();
  }

  renderDayView();
  return pop;
}

// ── initCalendar  (goal modal + daily task modal) ──────────────────────────
function initCalendar(wrapId, initialDate, onChange) {
  const wrap = document.getElementById(wrapId);
  if (!wrap) return;
  let selected = initialDate || null;
  // Initialize viewY/viewM in the DISPLAY calendar (Shamsi/Hijri/Gregorian)
  function _getViewCoords(dateStr) {
    if (dateStr) {
      const disp = _gregToDisplay(dateStr);
      return { y: disp.y, m: disp.m };
    }
    const t = _todayDisplay();
    return { y: t.y, m: t.m };
  }
  let { y: viewY, m: viewM } = _getViewCoords(selected);

  function displayLabel() {
    if (!selected) return 'Select a date…';
    const disp = _gregToDisplay(selected);
    const mNames = _monthNames(true);
    return `${mNames[disp.m - 1]} ${disp.d}, ${disp.y}`;
  }

  function renderTrigger() {
    wrap.innerHTML = `
      <button type="button" class="cal-trigger${selected ? '' : ' placeholder'}" id="${wrapId}-btn">
        <span>${displayLabel()}</span><span class="cal-trigger-icon">▾</span>
      </button>`;
    document.getElementById(wrapId + '-btn').onclick = e => { e.stopPropagation(); togglePop(); };
  }

  function togglePop() {
    if (document.getElementById(wrapId + '-pop')) {
      document.getElementById(wrapId + '-pop').remove(); return;
    }
    _buildCalPop(wrap, viewY, viewM, {
      popId: wrapId + '-pop',
      selected,
      onSelect(dateStr) {
        selected = dateStr;
        // update view to display-calendar coords of the selected date
        const coords = _getViewCoords(dateStr);
        viewY = coords.y; viewM = coords.m;
        onChange(selected);
        renderTrigger();
        const p = document.getElementById(wrapId + '-pop');
        if (p) p.remove();
      },
      footerButtons: [
        {
          key: 'today', label: 'Today',
          action() {
            const t = new Date();
            selected = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
            const coords = _getViewCoords(selected);
            viewY = coords.y; viewM = coords.m;
            onChange(selected); renderTrigger();
            const p = document.getElementById(wrapId + '-pop');
            if (p) p.remove();
          }
        },
        {
          key: 'clear', label: 'Clear',
          action() {
            selected = null; onChange(null); renderTrigger();
            const p = document.getElementById(wrapId + '-pop');
            if (p) p.remove();
          }
        }
      ]
    });
  }

  renderTrigger();
}

        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>
    </div>
  </div>`;
}

function deleteRoutine(id) {
  const r = S.routines.find(x => x.id === id);
  if (!r) return;
  showConfirm(
    `Delete routine <strong>${esc(r.name)}</strong> from all days?`,
    () => {
      S.routines = S.routines.filter(x => x.id !== id);
      S.routineExceptions = S.routineExceptions.filter(e => e.routineId !== id);
      S.routineOverrides  = S.routineOverrides.filter(o => o.routineId !== id);
      if (S.routineChecks) {
        Object.keys(S.routineChecks).forEach(k => {
          if (k.startsWith(`rc:${id}:`)) delete S.routineChecks[k];
        });
      }
      save(); renderRoutinesPage();
    },
    'Delete Routine', 'warn'
  );
}

let selectedRoutineDate = null;

function openRoutineModal(id) {
  const existing = id ? S.routines.find(r => r.id === id) : null;
  mCtx = { kind: 'routine', id };
  selectedRoutineDate = existing ? (existing.startDate || null) : null;

  document.getElementById('m-title').textContent = existing ? 'Edit Routine' : 'New Routine';
  document.getElementById('m-body').innerHTML = `
    <div class="f-group"><label class="f-label">Name <em>*</em></label>
      <input class="f-input" id="rtn-name" placeholder="Routine name…" value="${existing ? esc(existing.name) : ''}"></div>
    <div class="f-group"><label class="f-label">Description</label>
      <textarea class="f-textarea" id="rtn-desc" placeholder="Optional…">${existing ? esc(existing.desc||'') : ''}</textarea></div>
    <div class="f-group"><label class="f-label">Start Date (optional)</label>
      <div class="cal-wrap" id="rtn-cal-wrap"></div></div>
    <div class="f-group"><label class="f-label">Priority</label>
      <select class="f-select" id="rtn-pri" onchange="previewDailyPri(this.value,'rtn-pri-preview')">
        <option value="">— None —</option>
        <option value="kill"  ${existing && existing.priority==='kill'  ?'selected':''}>Kill it!</option>
        <option value="mid"   ${existing && existing.priority==='mid'   ?'selected':''}>Mid Slash!</option>
        <option value="final" ${existing && existing.priority==='final' ?'selected':''}>Final Rip!</option>
        <option value="chill" ${existing && existing.priority==='chill' ?'selected':''}>Chill Bro!</option>
      </select>
      <div class="f-pri-preview" id="rtn-pri-preview"></div></div>
    <div class="f-group"><label class="f-label">Link to Goal / Task (optional)</label>
      <select class="f-select" id="rtn-link">

        ${_linkableOptionsHTML(existing ? existing.linkedId : null)}

  document.getElementById('m-foot').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="submitRoutine()">Save Routine</button>`;

  if (existing && existing.priority) previewDailyPri(existing.priority, 'rtn-pri-preview');

function submitRoutine() {
  const name = document.getElementById('rtn-name').value.trim();
  if (!name) { showAlert('Name is required.', 'Missing Field', 'error'); return; }
  const { id } = mCtx;
  const data = {
    name,
    desc:      document.getElementById('rtn-desc').value.trim(),
    startDate: selectedRoutineDate || null,
    priority:  document.getElementById('rtn-pri').value || null,
    linkedId:  document.getElementById('rtn-link').value || null,
  };
  if (id) {
    Object.assign(S.routines.find(r => r.id === id), data);
  } else {
    const maxOrder = S.routines.length ? Math.max(...S.routines.map(r => r.order||0)) : -1;
    S.routines.push({ id: uid(), order: maxOrder + 1, createdAt: Date.now(), ...data });
  }
  save(); closeModal(); renderRoutinesPage();
}


// ── NOTES SECTION ────────────────────────────────────────────────────────
let _notesFilter = 'all';

function setNotesFilter(val, el) {
  _notesFilter = val;
  if (el && el.parentElement) {
    el.parentElement.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
  }
  renderNotesPage();
}

function stripHtml(html) {
  if (!html) return '';
  return html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
}

function renderNotesPage() {
  const list = document.getElementById('notes-list');
  if (!list) return;
  if (!S.notes.length) {
    list.innerHTML = `<div class="empty" style="grid-column: 1 / -1;"><div class="empty-icon">[ ]</div><div class="empty-text">No notes yet — add a Note or List above.</div></div>`;
    return;
  }

  const searchInput = document.getElementById('notes-search');
  const query = searchInput ? searchInput.value.toLowerCase().trim() : '';

  let filtered = S.notes.filter(n => {
    if (_notesFilter === 'note' && n.kind !== 'note') return false;
    if (_notesFilter === 'list' && n.kind !== 'list') return false;
    if (_notesFilter === 'pinned' && !n.pinned) return false;

    if (query) {
      const titleMatch = (n.title || '').toLowerCase().includes(query);
      let contentMatch = false;
      if (n.kind === 'list') {
        contentMatch = (n.items || []).some(i => (i.text || '').toLowerCase().includes(query));
      } else {
        contentMatch = stripHtml(n.body || '').toLowerCase().includes(query);
      }
      return titleMatch || contentMatch;
    }
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = `<div class="empty" style="grid-column: 1 / -1;"><div class="empty-icon">🔍</div><div class="empty-text">No matching notes found.</div></div>`;
    return;
  }

  const sorted = [...filtered].sort((a,b) => {
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    return (a.order||0) - (b.order||0);
  });

  list.innerHTML = sorted.map(n => noteCardHTML(n)).join('');
}

function noteCardHTML(n) {
  const escId = esc(n.id);
  let previewText = '';
  let metaBadge = '';

  if (n.kind === 'list') {
    const items = n.items || [];
    const total = items.length;
    const done = items.filter(i => i.done).length;
    const itemTexts = items.map(i => i.text).filter(Boolean).slice(0, 3).join(' • ');
    previewText = itemTexts ? '• ' + esc(itemTexts) : '<span class="note-empty-preview">Empty checklist</span>';
    metaBadge = `<span class="note-meta-pill">${done}/${total} done</span>`;
  } else {
    const rawText = stripHtml(n.body || '');
    const truncated = rawText.length > 90 ? rawText.slice(0, 90) + '…' : rawText;
    previewText = truncated ? esc(truncated) : '<span class="note-empty-preview">No description</span>';
    const wordCount = rawText ? rawText.split(/\s+/).filter(Boolean).length : 0;
    metaBadge = `<span class="note-meta-pill">${wordCount} words</span>`;
  }

  const editCall = n.kind === 'list' ? `openListModal('${escId}')` : `openNoteModal('${escId}','${n.kind}')`;

  return `<div class="note-card${n.pinned ? ' pinned' : ''}" id="nc-${n.id}"
    data-id="${n.id}" data-parentid="" data-type="note"
    onclick="if(!event.target.closest('.icon-btn,.drag-handle')) { ${editCall}; }"
    ondragover="_dragOver(event)" ondragleave="_dragLeave(event)" ondrop="_drop(event,'note')">
    <div class="note-head" draggable="true" ondragstart="_dragStart(event,'note')" ondragend="_dragEnd(event)">
      <span class="drag-handle" title="Drag to reorder" onclick="event.stopPropagation()">≡</span>
      ${n.pinned ? '<span class="note-pin-icon" title="Pinned">📌</span>' : ''}
      <span class="note-title">${esc(n.title)}</span>
      <span class="note-kind-badge">${n.kind === 'list' ? 'List' : 'Note'}</span>
      <div class="icon-actions" style="margin-left:auto" onclick="event.stopPropagation()">
        <button class="icon-btn${n.pinned ? ' icon-btn-danger' : ''}" title="${n.pinned ? 'Unpin' : 'Pin'}" onclick="event.stopPropagation();togglePin('${escId}')">
          <svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6.76l2 3.24H7Z"/></svg>
        </button>
        <button class="icon-btn" title="Edit" onclick="event.stopPropagation();${editCall}">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-btn icon-btn-danger" title="Delete" onclick="event.stopPropagation();deleteNote('${escId}')">
          <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
      </div>
    </div>
    <div class="note-body">
      <div class="note-snippet">${previewText}</div>
    </div>
    <div class="note-foot">
      ${metaBadge}
      <span class="note-open-hint">Open →</span>
    </div>
  </div>`;
}

function deleteNote(id) {
  const n = S.notes.find(x => x.id === id);
  if (!n) return;
  showConfirm(`Delete <strong>${esc(n.title)}</strong>?`, () => {
    S.notes = S.notes.filter(x => x.id !== id);
    save(); renderNotesPage();
  }, 'Delete Note', 'warn');
}

function togglePin(id) {
  const n = S.notes.find(x => x.id === id);
  if (!n) return;
  n.pinned = !n.pinned;
  save(); renderNotesPage();
}

// Renders the checklist rows for a list-type note card.
function listItemsHTML(n) {
  const items = n.items || [];
  if (!items.length) {
    return `<div style="color:var(--ink3);font-family:var(--font-mono);font-size:11px">No items yet — open the list to add some.</div>`;
  }
  return items.map(it => `
    <div class="note-li${it.done ? ' done' : ''}" data-li="${it.id}">
      <span class="note-li-check" onclick="toggleListItem('${esc(n.id)}','${esc(it.id)}')">${it.done ? '✓' : ''}</span>
      <span class="note-li-text">${esc(it.text)}</span>
    </div>`).join('');
}

// Toggle a single checklist item's done state. Uses a targeted DOM update
// (toggling the .done class on just this row) instead of a full
// renderNotesPage() re-render, since a note's list order is unaffected by
// done-state — this avoids rebuilding every card on each checkbox tap.
function toggleListItem(noteId, itemId) {
  const n = S.notes.find(x => x.id === noteId);
  if (!n || !n.items) return;
  const it = n.items.find(i => i.id === itemId);
  if (!it) return;
  it.done = !it.done;
  const row = document.querySelector(`#nc-${CSS.escape(noteId)} .note-li[data-li="${CSS.escape(itemId)}"]`);
  if (row) {
    row.classList.toggle('done', it.done);
    const chk = row.querySelector('.note-li-check');
    if (chk) chk.textContent = it.done ? '✓' : '';
  }
  save();
}

// ── LIST MODAL ─────────────────────────────────────────────────────────────
function openListModal(refId) {
  mCtx = { kind: 'list', refId };
  const existing = refId ? S.notes.find(n => n.id === refId) : null;
  const items = existing && existing.items ? existing.items : [];
  document.getElementById('m-title').textContent = existing ? 'Edit List' : 'New List';
  document.getElementById('m-body').innerHTML = `
    <div class="f-group"><label class="f-label">Title <em>*</em></label>
      <input class="f-input" id="list-title" placeholder="List title…" value="${existing ? esc(existing.title) : ''}"></div>

      <label class="f-label">Items</label>

  _renderListRows();

// in-memory working copy of list rows while the modal is open
window._listRows = [];

function _renderListRows() {
  const wrap = document.getElementById('list-items');
  if (!wrap) return;
  if (!window._listRows.length) {
    wrap.innerHTML = `<div style="color:var(--ink3);font-family:var(--font-mono);font-size:11px;margin-bottom:6px">No items yet.</div>`;
    return;
  }
  wrap.innerHTML = window._listRows.map((row, idx) => `
    <div class="list-row" data-idx="${idx}">
      <button type="button" class="list-row-check${row.done ? ' done' : ''}" title="${row.done ? 'Mark pending' : 'Mark completed'}" onclick="_toggleListRowCheck(${idx})">
        ${row.done ? '✓' : ''}
      </button>
      <input class="f-input list-row-text${row.done ? ' done-text' : ''}" value="${esc(row.text)}" placeholder="Item…"
        oninput="_listRowInput(${idx}, this.value)">
      <button type="button" class="icon-btn icon-btn-danger" title="Remove item" onclick="_removeListRow(${idx})">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>
    </div>`).join('');
}

function _toggleListRowCheck(idx) {
  if (window._listRows[idx]) {
    window._listRows[idx].done = !window._listRows[idx].done;
    _renderListRows();
  }
}

function _addListRow() {
  window._listRows.push({ id: uid(), text: '', done: false });
  _renderListRows();
  // focus the newly added input
  const inputs = document.querySelectorAll('#list-items .list-row-text');
  if (inputs.length) inputs[inputs.length - 1].focus();
}

function _removeListRow(idx) {
  window._listRows.splice(idx, 1);
  _renderListRows();
}

function _listRowInput(idx, val) {
  if (window._listRows[idx]) window._listRows[idx].text = val;
}

function submitList() {
  const titleEl = document.getElementById('list-title');
  if (!titleEl) return;
  const title = titleEl.value.trim();
  if (!title) { showAlert('Title is required.', 'Missing Field', 'error'); return; }
  // keep only rows that have text; preserve done flags from edits
  const items = window._listRows
    .filter(r => (r.text || '').trim().length)
    .map(r => ({ id: r.id, text: r.text.trim(), done: !!r.done }));
  const { refId } = mCtx;

  if (refId) {
    const n = S.notes.find(x => x.id === refId);
    if (n) Object.assign(n, { title, items });
  } else {
    const maxOrder = S.notes.length ? Math.max(...S.notes.map(x => x.order||0)) : -1;
    S.notes.push({ id: uid(), kind: 'list', title, items, pinned: false, order: maxOrder + 1, createdAt: Date.now() });
  }
  window._listRows = [];
  save(); closeModal(); renderNotesPage();
}

// ── RICH TEXT TOOLBAR ────────────────────────────────────────────────────
// Uses document.execCommand — still fully supported in the Chromium/WebKit
// webviews Tauri uses (WebView2/WKWebView), and the simplest reliable way to
// implement bold/italic/underline/size/highlight without a heavy editor
// dependency, keeping this app's zero-dependency philosophy intact.
function _rtExec(cmd) {
  const el = document.getElementById('note-body');
  if (el) el.focus();
  document.execCommand(cmd, false, null);
}
function _rtFontSize(size) {
  if (!size) return;
  const el = document.getElementById('note-body');
  if (el) el.focus();
  document.execCommand('fontSize', false, size);
}
function _rtHighlight(color) {
  const el = document.getElementById('note-body');
  if (el) el.focus();
  document.execCommand('hiliteColor', false, color);
}


// ── DRAG-TO-REORDER ENGINE ────────────────────────────────────────────────
let _dragSrcId   = null;
let _dragKind    = null; // 'goal' | 'daily'
let _dragParent  = null; // parentId of the dragged goal (for scope enforcement)

// ── COLLAPSE STATE ────────────────────────────────────────────────────────
// Holds ids of cards whose sub-boxes are currently collapsed. Persisted in
// S.collapsed (a plain array) so the open/closed state survives reloads.
let _collapsed = new Set(S.collapsed || []);
function _isCollapsed(id) { return _collapsed.has(id); }
function toggleCollapse(id) {
  if (_collapsed.has(id)) _collapsed.delete(id);
  else _collapsed.add(id);
  S.collapsed = [..._collapsed];
  save();
  const card = (document.getElementById('gc-' + id) || document.getElementById('tc-' + id));
  if (card) card.classList.toggle('collapsed', _collapsed.has(id));
}

function _dragStart(e, kind) {
  // For goals AND tasks, the draggable attribute lives on .gc-head (the
  // header row) to avoid HTML5's "nested draggable elements" ambiguity —
  // since a card's nested children (.gc-children) are SIBLINGS of the header
  // inside .goal-card (Long > Medium > Short, or Task > Sub-task), having
  // draggable=true on the OUTER card would conflict with the children's own
  // draggable=true, causing unreliable/broken drag behavior. The actual data
  // (id/parentId) lives on the outer .goal-card, so we resolve it via
  // closest() when the event fired from the header row.
  const el = (kind === 'goal' || kind === 'task') ? e.currentTarget.closest('.goal-card')
            : (kind === 'note' || kind === 'routine' || kind === 'daily' || kind === 'daily-routine') ? e.currentTarget.closest('[data-id]')
            : e.currentTarget;
  _dragSrcId  = el.dataset.id;
  _dragKind   = kind;
  _dragParent = el.dataset.parentid || '';
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', _dragSrcId);
  // slight delay so the opacity change doesn't affect the drag ghost
  setTimeout(() => el.classList.add('dragging'), 0);
}

function _dragEnd(e) {
  const el = (_dragKind === 'goal' || _dragKind === 'task') ? e.currentTarget.closest('.goal-card')
            : (e.currentTarget.closest('[data-id]') || e.currentTarget);
  el.classList.remove('dragging');
  document.querySelectorAll('.drag-over-top, .drag-over-bottom')
    .forEach(el => { el.classList.remove('drag-over-top','drag-over-bottom'); });
  _dragSrcId = _dragKind = _dragParent = null;
}

function _dragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const target = e.currentTarget;
  if (target.dataset.id === _dragSrcId) return;

  // Enforce scope: goals/tasks can only be reordered within the same parent group
  if ((_dragKind === 'goal' || _dragKind === 'task') && target.dataset.parentid !== _dragParent) return;

  // Notes have no parent/child nesting — any note can be reordered relative to any other note.

  const rect = target.getBoundingClientRect();
  const midY = rect.top + rect.height / 2;
  target.classList.remove('drag-over-top','drag-over-bottom');
  target.classList.add(e.clientY < midY ? 'drag-over-top' : 'drag-over-bottom');
}

function _dragLeave(e) {
  e.currentTarget.classList.remove('drag-over-top','drag-over-bottom');
}

function _drop(e, kind) {
  e.preventDefault();
  e.stopPropagation();
  const target = e.currentTarget;
  const wasDropTop = target.classList.contains('drag-over-top');
  target.classList.remove('drag-over-top','drag-over-bottom');

  const srcId = _dragSrcId;
  const tgtId = target.dataset.id;
  if (!srcId || srcId === tgtId) return;

  const dropTop = wasDropTop ||
    e.clientY < target.getBoundingClientRect().top + target.getBoundingClientRect().height / 2;

  if (kind === 'goal') {
    // find all siblings (same parentId), sort by current order
    const parentId = _dragParent || null;
    let siblings = S.goals
      .filter(g => (g.parentId||null) === parentId)
      .sort((a,b) => (a.order||0) - (b.order||0));

    // remove src from list, insert before/after target
    const srcIdx = siblings.findIndex(g => g.id === srcId);
    const tgtIdx = siblings.findIndex(g => g.id === tgtId);
    if (srcIdx === -1 || tgtIdx === -1) return;

    const [moved] = siblings.splice(srcIdx, 1);
    const insertAt = siblings.findIndex(g => g.id === tgtId);
    siblings.splice(dropTop ? insertAt : insertAt + 1, 0, moved);

    // reassign order values
    siblings.forEach((g, i) => { g.order = i; });
    save(); renderGoals();

  } else if (kind === 'task') {
    // find all siblings (same parentId within S.tasks), sort by current order
    const parentId = _dragParent || null;
    let siblings = S.tasks
      .filter(t => (t.parentId||null) === parentId)
      .sort((a,b) => (a.order||0) - (b.order||0));

    const srcIdx = siblings.findIndex(t => t.id === srcId);
    const tgtIdx = siblings.findIndex(t => t.id === tgtId);
    if (srcIdx === -1 || tgtIdx === -1) return;

    const [moved] = siblings.splice(srcIdx, 1);
    const insertAt = siblings.findIndex(t => t.id === tgtId);
    siblings.splice(dropTop ? insertAt : insertAt + 1, 0, moved);

    siblings.forEach((t, i) => { t.order = i; });
    save(); renderTasksPage();

  } else if (kind === 'daily') {
    // only reorder within same day
    let dayItems = S.daily
      .filter(t => t.date === plannerDate)
      .sort((a,b) => (a.order||0) - (b.order||0));

    const srcIdx = dayItems.findIndex(t => t.id === srcId);
    const tgtIdx = dayItems.findIndex(t => t.id === tgtId);
    if (srcIdx === -1 || tgtIdx === -1) return;

    const [moved] = dayItems.splice(srcIdx, 1);
    const insertAt = dayItems.findIndex(t => t.id === tgtId);
    dayItems.splice(dropTop ? insertAt : insertAt + 1, 0, moved);

    // reassign order — give global offsets so daily items from other days don't clash
    const baseOffset = Math.min(...S.daily.filter(t => t.date !== plannerDate).map(t => t.order||0), 0);
    dayItems.forEach((t, i) => { t.order = baseOffset - dayItems.length + i; });
    save(); renderDaily();
  } else if (kind === 'routine') {
    let items = [...S.routines].sort((a,b) => (a.order||0) - (b.order||0));
    const srcIdx = items.findIndex(r => r.id === srcId);
    const tgtIdx = items.findIndex(r => r.id === tgtId);
    if (srcIdx === -1 || tgtIdx === -1) return;
    const [moved] = items.splice(srcIdx, 1);
    const insertAt = items.findIndex(r => r.id === tgtId);
    items.splice(dropTop ? insertAt : insertAt + 1, 0, moved);
    items.forEach((r, i) => { r.order = i; });
    save(); renderRoutinesPage();
  } else if (kind === 'daily-routine') {
    const srcRid = srcId.replace('rtn:', '');
    const tgtRid = tgtId.replace('rtn:', '');
    let items = [...S.routines].sort((a,b) => (a.order||0) - (b.order||0));
    const srcIdx = items.findIndex(r => r.id === srcRid);
    const tgtIdx = items.findIndex(r => r.id === tgtRid);
    if (srcIdx === -1 || tgtIdx === -1) return;
    const [moved] = items.splice(srcIdx, 1);
    const insertAt = items.findIndex(r => r.id === tgtRid);
    items.splice(dropTop ? insertAt : insertAt + 1, 0, moved);
    items.forEach((r, i) => { r.order = i; });
    save(); renderDaily();
  } else if (kind === 'note') {
    // Notes have no parent/child nesting. Pinned and unpinned notes are
    // visually separate groups, so each is reordered independently — a note
    // dropped onto a pinned note stays within the pinned group, and vice
    // versa. We only re-sequence order within the target's group.
    const srcNote = S.notes.find(x => x.id === srcId);
    const tgtNote = S.notes.find(x => x.id === tgtId);
    if (!srcNote || !tgtNote) return;
    // dropping across groups isn't allowed — keep each group self-contained
    if (!!srcNote.pinned !== !!tgtNote.pinned) return;

    const samePin = !!srcNote.pinned;
    let group = S.notes
      .filter(n => !!n.pinned === samePin)
      .sort((a,b) => (a.order||0) - (b.order||0));

    const srcIdx = group.findIndex(n => n.id === srcId);
    const tgtIdx = group.findIndex(n => n.id === tgtId);
    if (srcIdx === -1 || tgtIdx === -1) return;

    const [moved] = group.splice(srcIdx, 1);
    const insertAt = group.findIndex(n => n.id === tgtId);
    group.splice(dropTop ? insertAt : insertAt + 1, 0, moved);

    group.forEach((n, i) => { n.order = i; });
    save(); renderNotesPage();
  }
}

  setCalSystem(nxt);
}

function triggerQuickNewItem() {
  const activePage = document.querySelector('.page.active')?.id;
  if (activePage === 'page-goals') openGoalModal(null, null);
  else if (activePage === 'page-tasks') openTaskModal(null, null);
  else if (activePage === 'page-daily') openDailyModal(null);
  else if (activePage === 'page-routines') openRoutineModal(null);
  else if (activePage === 'page-notes') openNoteModal(null, 'note');
}

function submitActiveModal() {
  if (!mCtx || !mCtx.kind) return;
  switch (mCtx.kind) {
    case 'goal': submitGoal(); break;
    case 'task': submitTask(); break;
    case 'daily': submitDaily(); break;
    case 'routine': submitRoutine(); break;
    case 'routine-day-edit': submitRoutineDayEdit(); break;
    case 'list': submitList(); break;
    case 'note': submitNote(); break;
    case 'copy':
    case 'move': submitCopyMove(); break;
  }
}

// ── PLATFORM KEYBOARD ACCELERATORS & MOBILE BACK BUTTON ────────────────
window.addEventListener('keydown', function(e) {
  const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0 || navigator.userAgent.indexOf('Mac') >= 0;
  const cmdCtrl = isMac ? e.metaKey : e.ctrlKey;
  const targetTag = e.target ? e.target.tagName : '';
  const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(targetTag) || (e.target && e.target.isContentEditable);

  // Escape key: close modals, custom dialogs, calendar popovers
  if (e.key === 'Escape') {
    const dialogOverlay = document.getElementById('cdialog-overlay');
    if (dialogOverlay && dialogOverlay.classList.contains('open')) {
      _closeCDialog();
      return;
    }
    const modalOverlay = document.getElementById('overlay');
    if (modalOverlay && modalOverlay.classList.contains('open')) {
      closeModal();
      return;
    }
    document.querySelectorAll('.cal-pop').forEach(p => p.remove());
    return;
  }

  // Cmd/Ctrl + Enter: Submit form in modal or confirm dialog
  if (cmdCtrl && e.key === 'Enter') {
    const dialogOverlay = document.getElementById('cdialog-overlay');
    if (dialogOverlay && dialogOverlay.classList.contains('open')) {
      e.preventDefault();
      const primaryBtn = dialogOverlay.querySelector('.cdialog-btn-primary');
      if (primaryBtn) primaryBtn.click();
      return;
    }
    const modalOverlay = document.getElementById('overlay');
    if (modalOverlay && modalOverlay.classList.contains('open')) {
      e.preventDefault();
      submitActiveModal();
      return;
    }
  }

  // Global Shortcuts with Cmd/Ctrl
  if (cmdCtrl) {
    // Cmd/Ctrl + S: Save Storage
    if (e.key.toLowerCase() === 's') {
      e.preventDefault();
      save();
      return;
    }

    // Cmd/Ctrl + Shift + T: Toggle Theme
    if (e.shiftKey && e.key.toLowerCase() === 't') {
      e.preventDefault();
      toggleTheme();
      return;
    }

    // Cmd/Ctrl + Shift + C: Cycle Calendar System
    if (e.shiftKey && e.key.toLowerCase() === 'c') {
      e.preventDefault();
      cycleCalSystem();
      return;
    }

    // Cmd/Ctrl + Shift + N: Quick New List on Notes page
    if (e.shiftKey && e.key.toLowerCase() === 'n') {
      e.preventDefault();
      const activePage = document.querySelector('.page.active')?.id;
      if (activePage === 'page-notes') openListModal(null);
      return;
    }

    // Cmd/Ctrl + /: Show Keyboard Shortcuts Guide
    if (e.key === '/' || e.key === '?') {
      e.preventDefault();
      openShortcutsModal();
      return;
    }

    // Cmd/Ctrl + 1..4: Switch topbar pages
    if (e.key === '1') { e.preventDefault(); const b = document.querySelector('[data-page="goals"]'); if (b) showPage('goals', b); return; }
    if (e.key === '2') { e.preventDefault(); const b = document.querySelector('[data-page="tasks"]'); if (b) showPage('tasks', b); return; }
    if (e.key === '3') { e.preventDefault(); const b = document.querySelector('[data-page="daily"]'); if (b) showPage('daily', b); return; }
    if (e.key === '4') { e.preventDefault(); const b = document.querySelector('[data-page="notes"]'); if (b) showPage('notes', b); return; }

    // Cmd/Ctrl + N: Quick new item action based on active page
    if (e.key.toLowerCase() === 'n' && !e.shiftKey) {
      e.preventDefault();
      triggerQuickNewItem();
      return;
    }

    // Cmd/Ctrl + F: Focus Note Search input if on notes page
    if (e.key.toLowerCase() === 'f') {
      const searchInput = document.getElementById('notes-search');
      if (searchInput && document.querySelector('#page-notes.active')) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
        return;
      }
    }
  }

  // Alt shortcuts (Windows / Linux accessibility)
  if (e.altKey && !cmdCtrl) {
    if (e.key === '1') { e.preventDefault(); const b = document.querySelector('[data-page="goals"]'); if (b) showPage('goals', b); return; }
    if (e.key === '2') { e.preventDefault(); const b = document.querySelector('[data-page="tasks"]'); if (b) showPage('tasks', b); return; }
    if (e.key === '3') { e.preventDefault(); const b = document.querySelector('[data-page="daily"]'); if (b) showPage('daily', b); return; }
    if (e.key === '4') { e.preventDefault(); const b = document.querySelector('[data-page="notes"]'); if (b) showPage('notes', b); return; }
    if (e.key.toLowerCase() === 'n') { e.preventDefault(); triggerQuickNewItem(); return; }
    if (e.key.toLowerCase() === 't') { e.preventDefault(); if (document.querySelector('#page-daily.active')) jumpToToday(); else toggleTheme(); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (document.querySelector('#page-daily.active')) shiftWeek(-1); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); if (document.querySelector('#page-daily.active')) shiftWeek(1); return; }
  }

  // Single-key shortcuts (Only when NOT typing inside an input field and NO modal is open)
  const modalOverlay = document.getElementById('overlay');
  const dialogOverlay = document.getElementById('cdialog-overlay');
  const isModalOpen = (modalOverlay && modalOverlay.classList.contains('open')) ||
                      (dialogOverlay && dialogOverlay.classList.contains('open'));

  if (!isTyping && !isModalOpen && !cmdCtrl && !e.altKey && !e.metaKey) {
    // Tab / Shift+Tab: Cycle between topbar rooms (Goals -> Tasks -> ToDos -> Notes & Lists)
    if (e.key === 'Tab') {
      e.preventDefault();
      const pages = ['goals', 'tasks', 'daily', 'notes'];
      const activePageEl = document.querySelector('.page.active');
      const activeId = activePageEl ? activePageEl.id.replace('page-', '') : 'goals';
      let idx = pages.indexOf(activeId);
      if (idx === -1) idx = 0;
      if (e.shiftKey) {
        idx = (idx - 1 + pages.length) % pages.length;
      } else {
        idx = (idx + 1) % pages.length;
      }
      showPage(pages[idx]);
      return;
    }

    // ? or F1: Open Keyboard Shortcuts Guide
    if (e.key === '?' || e.key === 'F1') {
      e.preventDefault();
      openShortcutsModal();
      return;
    }

    // Daily Planner Navigation
    if (document.querySelector('#page-daily.active')) {
      if (e.key.toLowerCase() === 't') { e.preventDefault(); jumpToToday(); return; }
      if (e.key === '[' || e.key === 'ArrowLeft') { e.preventDefault(); shiftWeek(-1); return; }
      if (e.key === ']' || e.key === 'ArrowRight') { e.preventDefault(); shiftWeek(1); return; }
      if (e.key.toLowerCase() === 'd' || e.key.toLowerCase() === 'j') { e.preventDefault(); toggleJumpCal(); return; }
    }

    // Focus Search on Notes page with '/'
    if (e.key === '/' && document.querySelector('#page-notes.active')) {
      e.preventDefault();
      const searchInput = document.getElementById('notes-search');
      if (searchInput) { searchInput.focus(); searchInput.select(); }
      return;
    }
  }
});

// Android Hardware Back Button & Mobile History Handling
window.addEventListener('popstate', function() {
  const dialogOverlay = document.getElementById('cdialog-overlay');
  if (dialogOverlay && dialogOverlay.classList.contains('open')) {
    _closeCDialog();
    return;
  }
  const modalOverlay = document.getElementById('overlay');
  if (modalOverlay && modalOverlay.classList.contains('open')) {
    closeModal();
    return;
  }
  const openPops = document.querySelectorAll('.cal-pop');
  if (openPops.length) {
    openPops.forEach(p => p.remove());
  }
});

// Auto-scroll focused inputs into view on mobile screens to prevent soft keyboard overlap
document.addEventListener('focusin', function(e) {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) && window.innerWidth <= 640) {
    setTimeout(() => {
      e.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 250);
  }
});
