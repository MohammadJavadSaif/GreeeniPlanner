<!DOCTYPE html>
<!-- GreeniPlanner — © 2026 GreeniAI. All rights reserved. -->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GreeniPlanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* ── MULTILINGUAL FONT SUPPORT ───────────────────
   Persian/Arabic: Vazirmatn (Google Fonts, covers Fa+Ar)
   Chinese: Noto Sans SC (Google Fonts, covers Simplified)
   @import MUST be first in the style block per CSS spec ──────────── */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&family=Vazirmatn:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');

/* ── TOKENS ─────────────────────────────────── */
:root {
  --bg0: #f2ede4;
  --bg1: #ebe5db;
  --bg2: #dfd8cc;
  --surface: #faf8f4;
  --ink:  #18160f;
  --ink2: #4c4840;
  --ink3: #9a9388;
  --rule: #2b2820;
  --rule2: #8a847a;
  --ac:    #1c7a3e;
  --ac-lt: #e6f3ea;
  --clr-long:   #1c7a3e;
  --clr-med:    #1a4f9c;
  --clr-short:  #5a8c1a;
  --clr-task:   #7a4f0a;
  --clr-sub:    #5a5248;
  --font-ui: 'Space Grotesk', 'Vazirmatn', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'Vazirmatn', 'Noto Sans SC', monospace;
  --shadow: 4px 4px 0 var(--rule);
  --shadow-sm: 2px 2px 0 var(--rule);
  /* daily priority colors */
  --kill-c:  #c0201a;
  --mid-c:   #9a6800;
  --final-c: #1a7a1a;
  --chill-c: #1a52a0;
  --pri-high-c:   #b01a1a;
  --pri-medium-c: #7a4f0a;
  --pri-chill-c:  #276c28;
}
[data-theme="dark"] {
  --bg0: #111009;
  --bg1: #1c1a12;
  --bg2: #272419;
  --surface: #161410;
  --ink:  #f0ece2;
  --ink2: #c0b8a8;
  --ink3: #706860;
  --rule: #d0c8b8;
  --rule2: #706860;
  --ac:    #2fbf63;
  --ac-lt: #0c2417;
  --clr-long:   #2fbf63;
  --clr-med:    #5a90e8;
  --clr-short:  #9fd84a;
  --clr-task:   #e8a040;
  --clr-sub:    #a09888;
  --kill-c:  #f05050;
  --mid-c:   #e8c040;
  --final-c: #50c850;
  --chill-c: #5090e8;
  --pri-high-c:   #f0605a;
  --pri-medium-c: #e8a840;
  --pri-chill-c:  #5fd45f;
}

/* ── RESET & PLATFORM OPTIMIZATIONS ──────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; overscroll-behavior-y: none; }
body {
  font-family: var(--font-ui); background: var(--bg0); color: var(--ink); min-height: 100vh;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
}
input, select, textarea, button { font-family: inherit; font-size: inherit; }
/* RTL: Arabic/Persian text in inputs auto-aligns correctly */
input, textarea { unicode-bidi: plaintext; text-align: start; }

/* Touch action optimization for fast click response on touch devices (Android) */
button, .btn, .icon-btn, .cal-nav-btn, .ds-cell, .note-card, .goal-card, .routine-card, .dt-checkbox {
  touch-action: manipulation;
}

/* Custom platform scrollbar (Windows & WebKit) */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg1); }
::-webkit-scrollbar-thumb { background: var(--rule2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--rule); }

/* Windows High-Contrast Mode Support */
@media (forced-colors: active) {
  .btn, .goal-card, .dt-item, .note-card, .routine-card, .modal {
    forced-color-adjust: none;
  }
}

/* Keyboard Shortcut Badges */
.sh-kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  background: var(--surface);
  border: 1px solid var(--rule2);
  border-radius: 3px;
  padding: 2px 5px;
  box-shadow: 1px 1px 0 var(--rule2);
  color: var(--ink);
  white-space: nowrap;
}

/* ── TOPBAR ─────────────────────────────────── */
#topbar {
  position: sticky; top: 0; z-index: 90;
  background: var(--rule); color: var(--bg0);
  display: flex; align-items: stretch;
  border-bottom: 2px solid var(--rule);
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.topbar-brand {
  font-family: var(--font-mono); font-weight: 700; font-size: 14px;
  letter-spacing: .08em; padding: 0 20px;
  display: flex; align-items: center;
  border-right: 1px solid rgba(255,255,255,.15);
  user-select: none;
}
.topbar-brand em { font-style: normal; margin-right: 6px; display: inline-flex; align-items: center; justify-content: center; }
.topbar-brand em svg { width: 17px; height: 17px; display: block; }
.topbar-nav { display: flex; flex: 1; }
.topbar-nav button {
  background: none; border: none; border-right: 1px solid rgba(255,255,255,.1);
  color: rgba(255,255,255,.6); font-family: var(--font-ui); font-size: 13px; font-weight: 500;
  padding: 0 20px; height: 46px; cursor: pointer; letter-spacing: .02em;
  transition: background .1s, color .1s;
}
.topbar-nav button:hover { background: rgba(255,255,255,.08); color: #fff; }
.topbar-nav button.active { background: var(--ac); color: #fff; }
.topbar-right {
  margin-left: auto; display: flex; align-items: center;
  gap: 6px; padding: 0 16px;
  border-left: 1px solid rgba(255,255,255,.1);
}
.theme-btn {
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
  color: #fff; width: 30px; height: 30px; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.theme-btn:hover { background: rgba(255,255,255,.22); }
#theme-lbl { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,.45); letter-spacing: .08em; }

/* calendar system selector */
.cal-sys-wrap {
  display: flex; border: 1px solid rgba(255,255,255,.25); overflow: hidden; margin-left: 4px;
}
.cal-sys-btn {
  background: rgba(255,255,255,.08); border: none; border-right: 1px solid rgba(255,255,255,.15);
  color: rgba(255,255,255,.45); font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: .06em; padding: 0 9px; height: 30px; cursor: pointer;
}
.cal-sys-btn:last-child { border-right: none; }
.cal-sys-btn:hover { background: rgba(255,255,255,.18); color: #fff; }
.cal-sys-btn.active { background: var(--ac); color: #fff; }

/* ── LAYOUT ─────────────────────────────────── */
.page {
  display: none;
  padding: 32px clamp(24px, 4vw, 56px) 40px;
  max-width: 1480px;
  width: 100%;
  margin: 0 auto;
  box-sizing: border-box;
}
.page.active { display: block; }

/* ── SECTION HEADER ─────────────────────────── */
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 2px solid var(--rule); padding-bottom: 12px; margin-bottom: 24px;
}
.sec-title {
  font-family: var(--font-mono); font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em; color: var(--ink);
}
.sec-title em { color: var(--ac); font-style: normal; }

/* ── BUTTONS ─────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-ui); font-size: 12px; font-weight: 600;
  letter-spacing: .03em; padding: 8px 16px; cursor: pointer;
  border: 2px solid var(--rule); background: var(--surface); color: var(--ink);
  transition: background .1s, color .1s, box-shadow .1s;
  white-space: nowrap;
}
.btn:hover { background: var(--rule); color: var(--bg0); box-shadow: var(--shadow-sm); }
.btn-primary { background: var(--ac); border-color: var(--ac); color: #fff; }
.btn-primary:hover { filter: brightness(1.1); background: var(--ac); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 11px; border-width: 1px; }
.btn-ghost { background: none; border-color: var(--rule2); color: var(--ink2); }
.btn-ghost:hover { background: var(--bg2); color: var(--ink); box-shadow: none; }

/* ── ICON BUTTONS (edit/delete) ──────────────── */
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; flex-shrink: 0;
  border: 1px solid var(--rule2); background: var(--surface);
  color: var(--ink2); cursor: pointer; padding: 0;
}
.icon-btn:hover { border-color: var(--rule); color: var(--ink); background: var(--bg2); }
.icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.icon-btn-danger { border-color: var(--rule2); color: #c0322a; }
.icon-btn-danger:hover { border-color: #c0322a; color: #fff; background: #c0322a; }
.icon-btn-copy  { border-color: var(--rule2); color: var(--clr-med); }
.icon-btn-copy:hover  { border-color: var(--clr-med); background: var(--clr-med); color: #fff; }
.icon-btn-move  { border-color: var(--rule2); color: var(--clr-task); }
.icon-btn-move:hover  { border-color: var(--clr-task); background: var(--clr-task); color: #fff; }
.icon-actions { display: flex; gap: 5px; align-items: center; }

/* ── FILTER PILLS ────────────────────────────── */
.filter-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.pill {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: .07em; text-transform: uppercase;
  padding: 5px 13px; border: 1px solid var(--rule2);
  background: var(--bg1); color: var(--ink2); cursor: pointer;
}
.pill:hover { border-color: var(--rule); color: var(--ink); }
.pill.active { background: var(--rule); color: var(--bg0); border-color: var(--rule); }

/* ── TYPE BADGES ─────────────────────────────── */
.type-badge {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .09em;
  padding: 2px 7px; border: 1px solid; flex-shrink: 0;
}
.t-long   { color: var(--clr-long);  border-color: var(--clr-long);  background: color-mix(in srgb, var(--clr-long) 10%, var(--surface)); }
.t-medium { color: var(--clr-med);   border-color: var(--clr-med);   background: color-mix(in srgb, var(--clr-med) 10%, var(--surface)); }
.t-short  { color: var(--clr-short); border-color: var(--clr-short); background: color-mix(in srgb, var(--clr-short) 10%, var(--surface)); }
.t-task   { color: var(--clr-task);  border-color: var(--clr-task);  background: color-mix(in srgb, var(--clr-task) 10%, var(--surface)); }
.t-subtask{ color: var(--clr-sub);   border-color: var(--clr-sub);   background: color-mix(in srgb, var(--clr-sub) 10%, var(--surface)); }

/* ── PRIORITY BADGE (goals) ──────────────────── */
.pri-badge {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
  padding: 2px 7px; border: 1px solid;
}
.pri-high   { color: var(--pri-high-c);   border-color: var(--pri-high-c);   background: color-mix(in srgb, var(--pri-high-c) 14%, var(--surface)); }
.pri-medium { color: var(--pri-medium-c); border-color: var(--pri-medium-c); background: color-mix(in srgb, var(--pri-medium-c) 14%, var(--surface)); }
.pri-chill  { color: var(--pri-chill-c);  border-color: var(--pri-chill-c);  background: color-mix(in srgb, var(--pri-chill-c) 14%, var(--surface)); }

/* ── GOAL CARD ───────────────────────────────── */
.goal-card { border: 2px solid var(--rule); background: var(--surface); margin-bottom: 12px; }
.gc-head {
  display: flex; flex-direction: column; gap: 10px;
  padding: 13px 16px; cursor: pointer; background: var(--bg1);
  border-bottom: 1px solid var(--rule2); user-select: none;
}
.gc-head:hover { background: var(--bg2); }
/* collapse toggle — a chevron on the header flips open/closed */
.gc-toggle {
  flex-shrink: 0; width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; padding: 0; outline: none; box-shadow: none;
  cursor: pointer;
  color: var(--ink); font-family: var(--font-ui); font-size: 8px; line-height: 1;
  transition: transform .15s ease, color .15s ease;
}
.gc-toggle:hover { color: var(--ac); }
.gc-toggle::before { content: '▼'; display: inline-block; }            /* expanded */
.gc-card.collapsed .gc-toggle { transform: rotate(-90deg); }
.gc-card.collapsed .gc-head { border-bottom: none; }
.gc-card.collapsed .gc-children { display: none; }
/* top row: drag handle + badge + name + right-aligned actions */
.gc-top {
  display: flex; align-items: center; gap: 12px;
}
.gc-name { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gc-meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink3); flex-shrink: 0; }
.gc-desc { font-size: 13px; font-weight: 400; color: var(--ink2); line-height: 1.65; max-width: 72ch; }
.gc-children {
  margin-top: 12px;
  padding: 2px 16px 14px 18px;
  border-left: 2px solid var(--bg2);
}
/* nested sub-boxes must be inset from the parent's right outline so their
   own borders don't collapse into / overlap the parent's right edge */
.gc-children > .goal-card {
  margin-bottom: 10px;
  margin-right: 0;
}
.gc-children > .goal-card:last-child { margin-bottom: 0; }

/* ── EMPTY STATE ─────────────────────────────── */
.empty { border: 2px dashed var(--rule2); background: var(--bg1); padding: 48px 20px; text-align: center; }
.empty-icon { font-size: 30px; opacity: .3; margin-bottom: 10px; font-family: var(--font-mono); }
.empty-text { font-family: var(--font-mono); font-size: 13px; color: var(--ink3); }

/* ── DAILY TASK ITEM ─────────────────────────── */
.dt-item {
  display: flex; align-items: stretch;
  border: 2px solid var(--rule); background: var(--surface);
  margin-bottom: 10px;
  transition: opacity .2s;
}
.dt-item.done { opacity: .45; }
.dt-item.done .dt-name { text-decoration: line-through; color: var(--ink3); }

/* left checkbox col */
.dt-check-col {
  width: 54px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg1); border-right: 2px solid var(--rule);
  cursor: pointer;
}
.dt-check-col:hover { background: var(--bg2); }
.dt-checkbox {
  width: 22px; height: 22px;
  border: 2px solid var(--rule2); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--surface);
  transition: background .15s, border-color .15s;
}
.dt-item.done .dt-checkbox { background: var(--ac); border-color: var(--ac); color: #fff; }

/* body */
.dt-body { flex: 1; padding: 13px 16px; min-width: 0; }
.dt-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.dt-desc { font-size: 13px; color: var(--ink3); margin-bottom: 7px; line-height: 1.55; max-width: 72ch; }
.dt-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* priority labels — each with its own color per spec */
.dp-kill  { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--kill-c);  letter-spacing: .04em; }
.dp-mid   { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--mid-c);   letter-spacing: .04em; }
.dp-final { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--final-c); letter-spacing: .04em; }
.dp-chill { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--chill-c); letter-spacing: .04em; }

.dt-link {
  font-family: var(--font-mono); font-size: 10px; color: var(--ink3);
  border: 1px solid var(--rule2); border-radius: 3px; padding: 1px 7px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px;
  display: inline-flex; align-items: center; vertical-align: middle; margin-left: 6px;
  background: var(--surface);
}

/* right actions col */
.dt-actions {
  display: flex; flex-direction: row; align-items: center; justify-content: center;
  gap: 6px; padding: 8px 14px;
  border-left: 1px solid var(--bg2); flex-shrink: 0;
}

/* ── PROGRESS BAR ────────────────────────────── */
.progress-wrap {
  background: var(--bg2); height: 5px; margin-bottom: 20px;
  border: 1px solid var(--rule2);
}
.progress-bar {
  height: 100%; background: var(--ac);
  transition: width .3s;
}

/* ── MODAL ───────────────────────────────────── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.55); z-index: 200;
  align-items: center; justify-content: center;
  padding: 24px;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 3px solid var(--rule);
  width: 540px; max-width: 95vw;
  max-height: min(720px, 90vh);
  display: flex; flex-direction: column;
  box-shadow: 8px 8px 0 var(--rule);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; background: var(--rule); color: var(--bg0);
  border-bottom: 2px solid var(--rule);
  flex: 0 0 auto;
}
.modal-title { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: .07em; }
.modal-close {
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
  color: #fff; width: 28px; height: 28px; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: rgba(255,255,255,.28); }
.modal-body {
  padding: 22px 20px;
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: visible;
}
.modal-foot {
  padding: 14px 18px; border-top: 2px solid var(--bg2);
  display: flex; gap: 8px; justify-content: flex-end;
  flex: 0 0 auto;
}

/* ── FORM ────────────────────────────────────── */
.f-group { margin-bottom: 18px; }
.f-label {
  display: block; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .09em; margin-bottom: 5px; color: var(--ink2);
}
.f-label em { color: var(--ac); font-style: normal; }
.f-input, .f-select, .f-textarea {
  width: 100%; background: var(--bg0); border: 2px solid var(--rule2);
  color: var(--ink); padding: 9px 11px; outline: none;
  font-family: var(--font-ui); font-size: 14px;
  transition: border-color .15s;
}
.f-input:focus, .f-select:focus, .f-textarea:focus { border-color: var(--ac); }
.f-textarea { resize: vertical; min-height: 68px; }
/* timeframe: three side-by-side labelled boxes */
.tf-triple { display: flex; gap: 0; }
.tf-triple .tf-unit-wrap {
  display: flex; flex-direction: column; flex: 1;
  border: 2px solid var(--rule2); border-right: none;
}
.tf-triple .tf-unit-wrap:last-child { border-right: 2px solid var(--rule2); }
.tf-triple .tf-unit-label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink3); padding: 3px 8px; background: var(--bg2);
  border-bottom: 1px solid var(--rule2);
}
.tf-triple .tf-unit-input {
  width: 100%; background: var(--bg0); border: none; outline: none;
  color: var(--ink); font-family: var(--font-mono); font-size: 14px;
  font-weight: 600; padding: 8px; text-align: center;
  -moz-appearance: textfield;
}
.tf-triple .tf-unit-input::-webkit-outer-spin-button,
.tf-triple .tf-unit-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.tf-triple .tf-unit-input:focus { background: var(--ac-lt); }
.tf-triple .tf-unit-wrap:focus-within { border-color: var(--ac); }
.tf-triple .tf-unit-wrap:focus-within .tf-unit-label { color: var(--ac); }

/* priority select preview */
.f-pri-preview {
  margin-top: 6px; font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  min-height: 20px; letter-spacing: .04em;
}

/* ── STAT CARDS ──────────────────────────────── */
.stats-row { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; }
.stat-card {
  flex: 1; min-width: 110px; max-width: 220px;
  border: 2px solid var(--rule); background: var(--surface);
  padding: 14px 18px;
}
.stat-val { font-family: var(--font-mono); font-size: 26px; font-weight: 700; color: var(--ac); line-height: 1; }
.stat-label {
  font-family: var(--font-mono); font-size: 10px; color: var(--ink3);
  text-transform: uppercase; letter-spacing: .08em; margin-top: 6px;
}

/* ── CUSTOM CALENDAR ─────────────────────────── */
.cal-wrap { position: relative; }
.cal-trigger {
  width: 100%; background: var(--bg0); border: 2px solid var(--rule2);
  color: var(--ink); padding: 8px 10px; cursor: pointer; text-align: left;
  font-family: var(--font-ui); font-size: 13px;
  display: flex; align-items: center; justify-content: space-between;
}
.cal-trigger:hover { border-color: var(--rule); }
.cal-trigger.placeholder { color: var(--ink3); }
.cal-trigger-icon { font-family: var(--font-mono); font-size: 12px; color: var(--ink3); }

.cal-pop {
  position: fixed; z-index: 250;
  width: 270px; background: var(--surface); border: 2px solid var(--rule);
  box-shadow: var(--shadow); padding: 12px;
}
.cal-pop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-pop-month { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.cal-nav-btn {
  width: 24px; height: 24px; border: 1px solid var(--rule2); background: var(--bg1);
  color: var(--ink); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.cal-nav-btn:hover { background: var(--bg2); border-color: var(--rule); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow { font-family: var(--font-mono); font-size: 10px; color: var(--ink3); text-align: center; padding: 4px 0; letter-spacing: .03em; }
.cal-day {
  font-family: var(--font-mono); font-size: 11px; text-align: center;
  padding: 6px 2px; cursor: pointer; border: 1px solid transparent; color: var(--ink2);
}
.cal-day:hover { border-color: var(--rule2); background: var(--bg1); }
.cal-day.muted { color: var(--ink3); opacity: .4; }
.cal-day.today { color: var(--ac); font-weight: 700; border-color: var(--ac); }
.cal-day.selected { background: var(--ac); color: #fff; border-color: var(--ac); }
.cal-pop-foot { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--bg2); }
.cal-text-btn {
  background: none; border: none; cursor: pointer; font-family: var(--font-mono);
  font-size: 10px; color: var(--ink3); text-transform: uppercase; letter-spacing: .06em;
  padding: 3px 6px;
}
.cal-text-btn:hover { color: var(--ac); }

/* clickable month/year label in calendar header */
.cal-pop-month {
  font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase;
  display: flex; gap: 5px; align-items: center;
}
.cal-pick-btn {
  background: none; border: none; cursor: pointer;
  font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink); padding: 2px 5px;
  border-bottom: 1px dashed var(--rule2);
}
.cal-pick-btn:hover { color: var(--ac); border-color: var(--ac); }

/* month picker grid (3 columns × 4 rows) */
.cal-month-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  margin-top: 8px;
}
.cal-month-cell {
  font-family: var(--font-mono); font-size: 11px; text-align: center;
  padding: 7px 2px; cursor: pointer; border: 1px solid transparent;
  color: var(--ink2);
}
.cal-month-cell:hover { border-color: var(--rule2); background: var(--bg1); }
.cal-month-cell.selected { background: var(--ac); color: #fff; border-color: var(--ac); }
.cal-month-cell.current  { color: var(--ac); font-weight: 700; }

/* year picker grid (3 columns, scrollable) */
.cal-year-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  margin-top: 8px; max-height: 180px; overflow-y: auto;
}
.cal-year-cell {
  font-family: var(--font-mono); font-size: 11px; text-align: center;
  padding: 7px 2px; cursor: pointer; border: 1px solid transparent;
  color: var(--ink2);
}
.cal-year-cell:hover { border-color: var(--rule2); background: var(--bg1); }
.cal-year-cell.selected { background: var(--ac); color: #fff; border-color: var(--ac); }
.cal-year-cell.current  { color: var(--ac); font-weight: 700; }

/* ── DATE STRIP (Daily Planner) ──────────────── */
.date-strip-wrap {
  border: 2px solid var(--rule); background: var(--surface);
  margin-bottom: 18px; padding: 12px 14px;
}
.date-strip-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
}
.date-strip-label {
  font-family: var(--font-mono); font-size: 13px; font-weight: 700;
  letter-spacing: .03em;
}
.date-strip-label .ds-sub { color: var(--ink3); font-weight: 500; margin-left: 6px; font-size: 11px; }
.date-strip-nav { display: flex; gap: 6px; align-items: center; }
.ds-nav-btn {
  width: 26px; height: 26px; border: 1px solid var(--rule2); background: var(--bg1);
  color: var(--ink); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.ds-nav-btn:hover { background: var(--bg2); border-color: var(--rule); }
.ds-today-btn {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--rule2);
  background: var(--bg1); color: var(--ink2); cursor: pointer;
}
.ds-today-btn:hover { border-color: var(--ac); color: var(--ac); }
.ds-jump-btn {
  width: 26px; height: 26px; border: 1px solid var(--rule2); background: var(--bg1);
  color: var(--ink); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.ds-jump-btn:hover { background: var(--bg2); border-color: var(--rule); }

.date-strip {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
  scroll-behavior: smooth;
}
.date-strip::-webkit-scrollbar { height: 4px; }
.ds-cell {
  flex: 1 1 0; min-width: 52px; max-width: 96px; padding: 10px 4px;
  border: 2px solid var(--rule2); background: var(--bg0);
  cursor: pointer; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  position: relative;
}
.ds-cell:hover { border-color: var(--rule); background: var(--bg1); }
.ds-cell.selected { background: var(--ac); border-color: var(--ac); }
.ds-cell.selected .ds-dow, .ds-cell.selected .ds-num, .ds-cell.selected .ds-mon { color: #fff; }
.ds-cell.is-today:not(.selected) { border-color: var(--ac); }
.ds-dow { font-family: var(--font-mono); font-size: 10px; color: var(--ink3); text-transform: uppercase; letter-spacing: .04em; }
.ds-num { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--ink); line-height: 1.1; }
.ds-mon { font-family: var(--font-mono); font-size: 9px; color: var(--ink3); text-transform: uppercase; letter-spacing: .04em; }
.ds-dot {
  width: 4px; height: 4px; border-radius: 50%; background: var(--ac);
  position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
}
.ds-cell.selected .ds-dot { background: #fff; }

/* jump-to-date popover reuses .cal-pop styles */
.ds-jump-wrap { position: relative; }

/* ── CUSTOM DIALOG (replaces browser confirm/alert) ──────────────────── */
.cdialog-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.6); z-index: 500;
  align-items: center; justify-content: center;
  padding: 20px;
}
.cdialog-overlay.open { display: flex; }
.cdialog {
  background: var(--surface); border: 3px solid var(--rule);
  box-shadow: 8px 8px 0 var(--rule);
  width: 420px; max-width: 95vw;
}
.cdialog-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; background: var(--rule); color: var(--bg0);
}
.cdialog-icon { font-size: 16px; flex-shrink: 0; }
.cdialog-head-title {
  font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase;
}
.cdialog-body {
  padding: 20px 18px;
  font-size: 14px; color: var(--ink2); line-height: 1.65;
}
.cdialog-body strong { color: var(--ink); }
.cdialog-foot {
  padding: 12px 18px; border-top: 2px solid var(--bg2);
  display: flex; gap: 8px; justify-content: flex-end;
}
/* variant colors for the header strip */
.cdialog-head.type-warn  { background: #8a3a00; }
.cdialog-head.type-error { background: #8a0000; }
.cdialog-head.type-info  { background: var(--rule); }

/* ── DRAG-TO-REORDER ─────────────────────────── */
.drag-handle {
  cursor: grab; flex-shrink: 0;
  width: 18px; height: 100%; display: flex; align-items: center; justify-content: center;
  color: transparent; font-size: 13px; font-family: var(--font-mono);
  transition: color .15s;
  user-select: none;
}
.goal-card:hover > .gc-head .drag-handle,
.dt-item:hover .drag-handle { color: var(--ink3); }
.drag-handle:hover { color: var(--rule) !important; cursor: grab; }
.drag-handle:active { cursor: grabbing; }

/* item being dragged */
.dragging { opacity: .35; }

/* drop target indicator */
.drag-over-top    { border-top:    3px solid var(--ac) !important; }
.drag-over-bottom { border-bottom: 3px solid var(--ac) !important; }

.date-pair-row { display: flex; gap: 10px; }
.date-pair-row .f-group { flex: 1; margin-bottom: 0; }

/* ── ROUTINES ────────────────────────────────── */
.routine-card {
  border: 2px solid var(--rule); background: var(--surface);
  margin-bottom: 10px; display: flex; align-items: stretch;
}
.routine-card-body { flex: 1; padding: 13px 16px; min-width: 0; }
.routine-card-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.routine-card-desc { font-size: 13px; color: var(--ink3); margin-bottom: 7px; line-height: 1.5; max-width: 72ch; }
.routine-card-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.routine-start-badge {
  font-family: var(--font-mono); font-size: 10px; color: var(--ink3);
  border: 1px solid var(--rule2); padding: 1px 7px;
}
.routine-card-actions {
  display: flex; flex-direction: row; align-items: center; justify-content: center;
  gap: 6px; padding: 8px 14px; border-left: 1px solid var(--bg2); flex-shrink: 0;
}
.routine-banner {
  border: 1px solid var(--ac); background: var(--ac-lt);
  padding: 10px 14px; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer;
}
.routine-banner:hover { filter: brightness(.97); }
.routine-banner-text { font-size: 13px; color: var(--ink2); }
.routine-banner-text strong { color: var(--ac); }
.routine-banner-arrow { font-family: var(--font-mono); font-size: 12px; color: var(--ac); }
.dt-item.is-routine { border-left: 3px solid var(--ac); }
.routine-tag {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
  padding: 1px 6px; border: 1px solid var(--ac); color: var(--ac);
  background: var(--ac-lt); flex-shrink: 0;
  display: inline-flex; align-items: center; vertical-align: middle; margin-left: 6px;
  border-radius: 3px;
}

/* ── NOTES ───────────────────────────────────── */
.notes-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 20px;
}
.notes-filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.notes-search-wrap {
  display: flex; align-items: center; gap: 8px; background: var(--surface);
  border: 2px solid var(--rule); padding: 4px 10px; border-radius: 4px;
  box-shadow: 2px 2px 0 var(--rule);
}
.notes-search-icon { font-size: 13px; opacity: 0.6; }
.notes-search-input {
  border: none; background: transparent; outline: none;
  font-family: var(--font-ui); font-size: 13px; color: var(--ink); width: 160px;
}

#notes-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  align-items: stretch;
}

.note-card {
  border: 2px solid var(--rule); background: var(--surface);
  border-radius: 6px; box-shadow: 3px 3px 0 var(--rule);
  display: flex; flex-direction: column;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  cursor: pointer; overflow: hidden; position: relative;
}
.note-card:hover {
  transform: translateY(-3px); box-shadow: 5px 5px 0 var(--rule);
  border-color: var(--ac);
}
.note-card.pinned {
  border-color: var(--ac); background: var(--ac-lt);
}

.note-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; cursor: grab; background: var(--bg1);
  border-bottom: 1px solid var(--rule2); user-select: none;
  -webkit-user-drag: element;
}
.note-card.pinned .note-head { background: rgba(28, 122, 62, 0.12); }
.note-title {
  font-weight: 700; font-size: 14px; color: var(--ink);
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.note-kind-badge {
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
  padding: 2px 6px; border: 1px solid var(--rule2); border-radius: 3px;
  color: var(--ink2); background: var(--surface); flex-shrink: 0;
}
.note-pin-icon { font-size: 12px; flex-shrink: 0; }

.note-body {
  padding: 12px 14px; flex: 1; display: flex; flex-direction: column; justify-content: flex-start;
}
.note-snippet {
  font-size: 13px; color: var(--ink2); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; text-overflow: ellipsis; word-break: break-word;
}
.note-empty-preview { font-style: italic; color: var(--ink3); font-size: 12px; }

.note-foot {
  padding: 8px 14px; border-top: 1px dashed var(--rule2);
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(0,0,0,0.02); font-size: 11px; margin-top: auto;
}
.note-meta-pill { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--ink3); }
.note-open-hint {
  font-family: var(--font-mono); font-size: 10px; color: var(--ac); font-weight: 600;
  opacity: 0.8; transition: opacity .15s ease, transform .15s ease;
}
.note-card:hover .note-open-hint { opacity: 1; transform: translateX(2px); }

/* list / checklist notes */
.note-list { display: flex; flex-direction: column; gap: 4px; }
.note-li {
  display: flex; align-items: flex-start; gap: 9px;
  font-size: 13.5px; color: var(--ink); line-height: 1.5;
}
.note-li-check {
  flex-shrink: 0; width: 18px; height: 18px; margin-top: 1px;
  border: 2px solid var(--rule2); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--surface);
  cursor: pointer; user-select: none;
}
.note-li-check:hover { border-color: var(--ac); }
.note-li.done .note-li-check { background: var(--ac); border-color: var(--ac); color: #fff; }
.note-li.done .note-li-text { text-decoration: line-through; color: var(--ink3); }
/* Dark theme: the unchecked checkbox border (--rule2) sits too low against the
   near-black surface, so lift it to a more visible tone for contrast. */
[data-theme="dark"] .note-li-check { border-color: #8a847a; }
[data-theme="dark"] .note-li-check:hover { border-color: var(--ac); }

/* list editor rows inside the modal */
.list-items-editor { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.list-row { display: flex; align-items: center; gap: 8px; }
.list-row-text { flex: 1; }
.list-row-text.done-text { text-decoration: line-through; color: var(--ink3); }
.list-row-check {
  flex-shrink: 0; width: 20px; height: 20px;
  border: 2px solid var(--rule2); background: var(--surface); border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
  cursor: pointer; user-select: none; transition: background .15s ease, border-color .15s ease;
}
.list-row-check:hover { border-color: var(--ac); }
.list-row-check.done { background: var(--ac); border-color: var(--ac); }
[data-theme="dark"] .list-row-check { border-color: #8a847a; }
[data-theme="dark"] .list-row-check:hover { border-color: var(--ac); }


/* rich text toolbar */
.rt-toolbar {
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  padding: 6px; border: 2px solid var(--rule2); border-bottom: none;
  background: var(--bg2);
}
.rt-btn {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--rule2); background: var(--surface); color: var(--ink);
  cursor: pointer; font-family: var(--font-ui); font-size: 13px; font-weight: 700;
}
.rt-btn:hover { background: var(--bg1); border-color: var(--rule); }
.rt-btn.active { background: var(--ac); color: #fff; border-color: var(--ac); }
.rt-btn.rt-underline { text-decoration: underline; }
.rt-sep { width: 1px; align-self: stretch; background: var(--rule2); margin: 0 2px; }
.rt-size-select {
  height: 28px; border: 1px solid var(--rule2); background: var(--surface); color: var(--ink);
  font-family: var(--font-ui); font-size: 12px; padding: 0 4px; cursor: pointer;
}
.rt-color-wrap { position: relative; width: 28px; height: 28px; }
.rt-color-swatch {
  width: 28px; height: 28px; border: 1px solid var(--rule2); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 13px; background: var(--surface);
}
.rt-color-input {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 28px; height: 28px;
}
#note-body { border-top: none !important; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg1); }
::-webkit-scrollbar-thumb { background: var(--rule2); }

/* ── MOBILE RESPONSIVENESS ─────────────────── */
/* Applied on narrow viewports (phones) — the Android WebView build in
   particular. Touch targets are bumped for coarse pointers without
   changing desktop sizing. */
@media (max-width: 640px) {
  .page { padding: 16px 12px 28px; }

  /* Topbar: allow the nav strip to scroll horizontally instead of
     wrapping/squishing once the 4 tabs + toggles no longer fit. */
  #topbar { flex-wrap: nowrap; }
  .topbar-brand { padding: 0 10px; font-size: 11px; }
  .topbar-nav { overflow-x: auto; flex: 1 1 auto; scrollbar-width: none; }
  .topbar-nav::-webkit-scrollbar { display: none; }
  .topbar-nav button { padding: 0 12px; font-size: 12px; flex-shrink: 0; }
  .topbar-right { padding: 0 8px; gap: 4px; flex-shrink: 0; }
  #theme-lbl { display: none; }

  /* Touch-friendly icon buttons (≥36px targets on coarse pointers). */
  @media (pointer: coarse) {
    .icon-btn { width: 36px; height: 36px; }
    .icon-btn svg { width: 16px; height: 16px; }
    .dt-check-col { width: 48px; }
    .dt-checkbox { width: 26px; height: 26px; }
    .cal-nav-btn { width: 32px; height: 32px; }
    .ds-nav-btn, .ds-jump-btn { width: 34px; height: 34px; }
  }

  .sec-head { flex-wrap: wrap; gap: 10px; margin-bottom: 16px; padding-bottom: 10px; }
  .sec-title { font-size: 15px; }

  /* Modal internals: stack the side-by-side rows vertically on phones. */
  .tf-triple { flex-direction: column; }
  .tf-triple .tf-unit-wrap { border-right: 2px solid var(--rule2); border-bottom: none; }
  .tf-triple .tf-unit-wrap:last-child { border-bottom: 2px solid var(--rule2); }
  .date-pair-row { flex-direction: column; gap: 0; }
  .date-pair-row .f-group { margin-bottom: 18px; }
  .overlay { padding: 8px; }
  .modal { width: 100%; max-width: 540px; max-height: 92vh; border-width: 2px; box-shadow: 4px 4px 0 var(--rule); border-radius: 6px; }

  /* Date strip: let it scroll horizontally but tighten cells so a full
     week still fits comfortably on the narrowest realistic phones. */
  .date-strip-head { flex-wrap: wrap; gap: 8px; }
  .ds-cell { min-width: 40px; max-width: 72px; padding: 8px 2px; }
  .ds-num { font-size: 15px; }

  /* Stat cards: clean 2-column grid layout on mobile */
  .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat-card { max-width: none; min-width: 0; padding: 10px 12px; }

  /* Goal/Task header rows & nested children */
  .gc-top { flex-wrap: wrap; }
  .gc-name { flex: 1 1 100%; order: 2; white-space: normal; }
  .gc-meta { order: 3; }
  .gc-top .icon-actions { order: 1; margin-left: auto; }
  .gc-children { margin-top: 8px; padding: 2px 4px 10px 8px; }
  .dt-body .dt-name { white-space: normal; }

  /* Notes search bar expansion on mobile */
  .notes-search-wrap { width: 100%; }
  .notes-search-input { width: 100%; }
}

/* Very small phones: hide text wordmark to preserve icon & keep room for navigation */
@media (max-width: 420px) {
  .topbar-brand-text { display: none; }
  .topbar-brand { padding: 0 8px; }
}
</style>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────
let S = {
  goals: [],   // long/medium/short only — tasks & subtasks moved to S.tasks
  tasks: [],   // Task (parentId=null, linkedGoalId=optional) and Sub-task (parentId=parent task's id)
  daily: [],
  routines: [],          // master routine definitions
  routineExceptions: [], // { routineId, date } — routine hidden for a specific day
  routineOverrides: [],  // { routineId, date, data } — routine edited for a specific day
  notes: [],   // { id, kind:'note'|'list', title, body(note)/items(list), pinned, order, createdAt }
  theme: 'light',
  calSystem: 'gregorian'
};

function load() {
  try {
    // migration chain: oldest key → newest
    const r1  = localStorage.getItem('mamal_s1');
    const r2  = localStorage.getItem('mamal_s2');
    const r3  = localStorage.getItem('greeni_planner_v1');
    const r4  = localStorage.getItem('greeni_planner_v2');
    if      (r4) S = JSON.parse(r4);
    else if (r3) S = JSON.parse(r3);
    else if (r2) S = JSON.parse(r2);
    else if (r1) { const old = JSON.parse(r1); S.goals = old.goals || []; S.theme = old.theme || 'light'; }
  } catch(_){}

  // ensure all arrays exist (handles upgrades from older versions)
  if (!Array.isArray(S.tasks))              S.tasks = [];
  if (!Array.isArray(S.daily))              S.daily = [];
  if (!Array.isArray(S.routines))           S.routines = [];
  if (!Array.isArray(S.routineExceptions))  S.routineExceptions = [];
  if (!Array.isArray(S.routineOverrides))   S.routineOverrides = [];
  if (!Array.isArray(S.notes))              S.notes = [];
  if (!S.routineChecks)                     S.routineChecks = {};
  if (!S.calSystem)                         S.calSystem = 'gregorian';

  let migrated = false;

  // migrate: any daily task without a date gets assigned to today
  S.daily.forEach(t => { if (!t.date) { t.date = todayStr(); migrated = true; } });

  // migrate: assign order field to goals (grouped by parentId)
  if (Array.isArray(S.goals)) {
    const groups = {};
    S.goals.forEach(g => {
      const key = g.parentId || '__root__';
      if (!groups[key]) groups[key] = [];
      groups[key].push(g);
    });
    Object.values(groups).forEach(grp => {
      grp.forEach((g, i) => {
        if (g.order === undefined) { g.order = i; migrated = true; }
      });
    });
  }

  // migrate: assign order field to daily tasks
  S.daily.forEach((t, i) => {
    if (t.order === undefined) { t.order = i; migrated = true; }
  });

  // migrate: old { v, u } timeframe → { y, m, d }
  if (Array.isArray(S.goals)) {
    S.goals.forEach(g => {
      if (g.timeframe && g.timeframe.v !== undefined) {
        g.timeframe = _migrateTimeframe(g.timeframe);
        migrated = true;
      }
      if ((g.type === 'task' || g.type === 'subtask') && g.date && !g.startDate) {
        g.startDate = g.date;
        g.date = null;
        migrated = true;
      }
    });
  }

  // migrate: move Task/Sub-task items out of S.goals into the new S.tasks
  // array (Tasks/Sub-tasks now live in their own section, separate from the
  // Goals hierarchy which is long/medium/short only). This runs on every
  // load as an ongoing safety net until the old Goals-based task creation UI
  // is fully removed, so any stragglers created in the interim still migrate.
  if (Array.isArray(S.goals)) {
    const stray = S.goals.filter(g => g.type === 'task' || g.type === 'subtask');
    if (stray.length) {
      stray.forEach(g => {
        if (g.type === 'task') {
          // old parentId pointed at a short-term goal — becomes the linked goal
          g.linkedGoalId = g.parentId || null;
          g.parentId = null;
          // clear the stale order value: it was scoped to the old parent-goal
          // group, but all top-level tasks now share ONE group (parentId=null),
          // so distinct former groups could otherwise collide on the same
          // order number. The order-assignment step below re-sequences it.
          delete g.order;
        }
        // subtasks: parentId already correctly points at their parent Task's
        // id (which migrates alongside them, same id preserved) — their
        // sibling grouping is unchanged, so their existing order stays valid.
        if (g.linkedGoalId === undefined) g.linkedGoalId = null;
        S.tasks.push(g);
      });
      S.goals = S.goals.filter(g => g.type !== 'task' && g.type !== 'subtask');
      migrated = true;
    }
  }

  // migrate: assign order field to tasks (grouped by parentId, same pattern as goals)
  if (Array.isArray(S.tasks)) {
    const taskGroups = {};
    S.tasks.forEach(t => {
      const key = t.parentId || '__root__';
      if (!taskGroups[key]) taskGroups[key] = [];
      taskGroups[key].push(t);
    });
    Object.values(taskGroups).forEach(grp => {
      grp.forEach((t, i) => {
        if (t.order === undefined) { t.order = i; migrated = true; }
      });
    });
  }

  // migrate: assign order field to routines
  S.routines.forEach((r, i) => {
    if (r.order === undefined) { r.order = i; migrated = true; }
  });

  applyTheme();
  applyCalSystem();
  if (migrated) save();
}
// Persist state to localStorage. Writes are debounced (≤120ms window) so that
// rapid successive mutations — e.g. a drag-reorder firing many saves, or a
// burst of toggles — collapse into a single serialised write instead of
// thrashing localStorage. The trailing write always happens, so no data is
// ever lost. flushSave() forces an immediate write (used right before the
// window unloads, and after critical mutations like modal submits/deletes).
let _saveTimer = null;
function save() {
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(flushSave, 120);
}
function flushSave() {
  if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
  localStorage.setItem('greeni_planner_v2', JSON.stringify(S));
}
// Best-effort flush on tab close / app exit so a pending debounced write
// doesn't get dropped.
window.addEventListener('beforeunload', flushSave);

// ── THEME ─────────────────────────────────────────────────────────────────
function toggleTheme() { S.theme = S.theme === 'light' ? 'dark' : 'light'; applyTheme(); save(); }
function applyTheme() {
  document.documentElement.setAttribute('data-theme', S.theme);
  document.getElementById('theme-lbl').textContent = S.theme.toUpperCase();
}

// ── NAV ───────────────────────────────────────────────────────────────────
function showPage(p, btn) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.topbar-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');
  const targetBtn = btn || document.querySelector(`.topbar-nav [data-page="${p}"]`);
  if (targetBtn) {
    targetBtn.classList.add('active');
  } else if (p === 'routines') {
    const dailyBtn = document.querySelector('.topbar-nav [data-page="daily"]');
    if (dailyBtn) dailyBtn.classList.add('active');
  }
  if (p === 'goals')    renderGoals();
  if (p === 'tasks')    renderTasksPage();
  if (p === 'daily')    renderDaily();
  if (p === 'routines') renderRoutinesPage();
  if (p === 'notes')    renderNotesPage();
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ── ROUTINE HELPERS ────────────────────────────────────────────────────────

// Is a routine active on a given YYYY-MM-DD date?
function _routineActiveOnDate(routine, dateStr) {
  if (!routine) return false;
  if (S.routineExceptions.some(e => e.routineId === routine.id && e.date === dateStr)) return false;
  if (routine.startDate && dateStr < routine.startDate) return false;
  return true;
}

// Get effective routine data for a day (override if exists, else master)
function _routineDataForDay(routineId, dateStr) {
  const override = S.routineOverrides.find(o => o.routineId === routineId && o.date === dateStr);
  if (override) return { ...override.data, id: routineId, isRoutine: true, isOverride: true };
  const master = S.routines.find(r => r.id === routineId);
  if (!master) return null;
  return { ...master, isRoutine: true, isOverride: false };
}

// Get all routines active on a given date (as displayable objects)
function _routinesForDate(dateStr) {
  return S.routines
    .filter(r => _routineActiveOnDate(r, dateStr))
    .map(r => _routineDataForDay(r.id, dateStr))
    .filter(Boolean)
    .sort((a, b) => (a.order || 0) - (b.order || 0));
}

// Is a routine checked (done) for a specific date?
function _routineCheckedForDay(routineId, dateStr) {
  const key = `rc:${routineId}:${dateStr}`;
  return !!(S.routineChecks && S.routineChecks[key]);
}

// Toggle routine done state for a specific date only
function _toggleRoutineCheck(routineId, dateStr) {
  if (!S.routineChecks) S.routineChecks = {};
  const key = `rc:${routineId}:${dateStr}`;
  S.routineChecks[key] = !S.routineChecks[key];
  save();
}


function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Converts { y, m, d } timeframe to a readable string e.g. "2y 3m 10d"
// Also handles old data model { v, u } from earlier versions
function _fmtTimeframe(tf) {
  if (!tf) return '';
  // old model migration (for display only — data is migrated on load)
  if (tf.v !== undefined && tf.u !== undefined) {
    return `${tf.v} ${tf.u}`;
  }
  const parts = [];
  if (tf.y) parts.push(`${tf.y}y`);
  if (tf.m) parts.push(`${tf.m}mo`);
  if (tf.d) parts.push(`${tf.d}d`);
  return parts.join(' ') || '';
}

// Formats a Gregorian YYYY-MM-DD string to display-calendar short label
const MONTH_SHORT_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function _fmtDateShort(dateStr) {
  if (!dateStr) return '';
  const disp = _gregToDisplay(dateStr);
  const mShort = _monthNames(true);
  return `${mShort[disp.m - 1]} ${disp.d}, ${disp.y}`;
}
function _migrateTimeframe(tf) {
  if (!tf) return null;
  if (tf.y !== undefined || tf.m !== undefined || tf.d !== undefined) return tf; // already new format
  // old format: { v: "3", u: "Years" } or { v: "6", u: "Months" }
  const v = parseInt(tf.v) || 0;
  if (tf.u === 'Years')  return { y: v, m: null, d: null };
  if (tf.u === 'Months') return { y: null, m: v, d: null };
  return { y: null, m: v, d: null }; // fallback
}

const TYPE_LABEL = { long:'Long-term', medium:'Medium-term', short:'Short-term', task:'Task', subtask:'Sub-task' };
const ROOT_TYPE_LABEL = { long:'Long-term', medium:'Medium-term', short:'Short-term' };
const TYPE_CSS   = { long:'t-long', medium:'t-medium', short:'t-short', task:'t-task', subtask:'t-subtask' };
const ALLOWED_CHILDREN = { long:['medium','short'], medium:['short'], short:[] };

function children(pid) {
  return S.goals.filter(g => g.parentId === pid).sort((a,b) => (a.order||0) - (b.order||0));
}
function allDescendants(id) {
  const kids = children(id);
  return kids.concat(kids.flatMap(k => allDescendants(k.id)));
}

// ── TASKS SECTION ───────────────────────────────────────────────────────────
// S.tasks holds both Tasks (parentId=null, optional linkedGoalId) and
// Sub-tasks (parentId = their parent Task's id). Mirrors the Goals section's
// children()/allDescendants() pattern, scoped to the separate S.tasks array.
function taskChildren(pid) {
  return S.tasks.filter(t => t.parentId === pid).sort((a,b) => (a.order||0) - (b.order||0));
}
function taskDescendants(id) {
  const kids = taskChildren(id);
  return kids.concat(kids.flatMap(k => taskDescendants(k.id)));
}

let taskFilter = 'all';
function setTaskFilter(f, el) {
  taskFilter = f;
  document.querySelectorAll('#page-tasks .pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderTasksPage();
}

function renderTasksStats() {
  const el = document.getElementById('tasks-stats');
  if (!el) return;
  const taskCount = S.tasks.filter(t => t.type === 'task').length;
  const subCount  = S.tasks.filter(t => t.type === 'subtask').length;
  el.innerHTML = `
    <div class="stat-card"><div class="stat-val">${taskCount}</div><div class="stat-label">Tasks</div></div>
    <div class="stat-card"><div class="stat-val">${subCount}</div><div class="stat-label">Sub-tasks</div></div>`;
}

function renderTasksPage() {
  renderTasksStats();
  const roots = S.tasks.filter(t => !t.parentId).sort((a,b) => (a.order||0) - (b.order||0));
  const filtered = taskFilter === 'all' ? roots : (taskFilter === 'task' ? roots : []);
  // (subtask filter shows none at root level since subtasks are never root — handled below)
  const list = document.getElementById('tasks-list');
  if (!list) return;

  if (taskFilter === 'subtask') {
    // flat view of just sub-tasks, regardless of parent
    const subs = S.tasks.filter(t => t.type === 'subtask').sort((a,b) => (a.order||0) - (b.order||0));
    if (!subs.length) {
      list.innerHTML = `<div class="empty"><div class="empty-icon">[ ]</div><div class="empty-text">No sub-tasks yet.</div></div>`;
      return;
    }
    list.innerHTML = subs.map(t => taskCardHTML(t)).join('');
    return;
  }

  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">[ ]</div><div class="empty-text">No tasks yet — hit "+ New Task" to begin.</div></div>`;
    return;
  }
  list.innerHTML = filtered.map(t => taskCardHTML(t)).join('');
}

// Renders a Task or Sub-task card with full field display
function taskCardHTML(t) {
  const kids = taskChildren(t.id);
  const childHTML = kids.map(k => taskCardHTML(k)).join('');
  const tf = t.timeframe ? _fmtTimeframe(t.timeframe) : '';
  let dateDisplay = '';
  if (t.startDate || t.endDate) {
    const s = t.startDate ? _fmtDateShort(t.startDate) : '?';
    const e = t.endDate   ? _fmtDateShort(t.endDate)   : '?';
    dateDisplay = ` · ${s} → ${e}`;
  }
  const pri = t.priority ? `<span class="pri-badge pri-${t.priority}">${t.priority}</span>` : '';
  const linkedGoal = t.linkedGoalId ? S.goals.find(g => g.id === t.linkedGoalId) : null;
  const linkBadge = linkedGoal ? `<span class="dt-link">↗ ${esc(linkedGoal.name)}</span>` : '';
  const addSubBtn = t.type === 'task'
    ? `<button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();openTaskModal('${t.id}','subtask')">+ Sub-task</button>`
    : '';

  const collapsed = _isCollapsed(t.id) && kids.length;
  const toggleBtn = kids.length
    ? `<button class="gc-toggle" title="Collapse / expand" onclick="event.stopPropagation();toggleCollapse('${t.id}')"></button>`
    : `<span class="gc-toggle" style="visibility:hidden"></span>`;
  return `<div class="goal-card gc-card${collapsed ? ' collapsed' : ''}" id="tc-${t.id}"
    data-id="${t.id}" data-parentid="${t.parentId||''}" data-type="${t.type}"
    ondragover="_dragOver(event)" ondragleave="_dragLeave(event)" ondrop="_drop(event,'task')">
    <div class="gc-head" draggable="true"
      ondragstart="_dragStart(event,'task')" ondragend="_dragEnd(event)"
      onclick="if(event.target.closest('.gc-toggle,.icon-btn,.btn,.drag-handle'))return; toggleCollapse('${t.id}')">
      <div class="gc-top">
        ${toggleBtn}

function deleteTask(id) {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const desc = taskDescendants(id);

    ? `Delete <strong>${esc(t.name)}</strong> and its ${desc.length} nested sub-task(s)?`

// Auto-fills the Duration boxes from Start/End date, mirroring the same
// date-math the Goals section used to use before Tasks moved to their own section.
function _autoCalcTaskDuration() {
  if (!selectedTaskStartDate || !selectedTaskEndDate) return;
  const start = new Date(selectedTaskStartDate + 'T12:00:00');
  const end   = new Date(selectedTaskEndDate   + 'T12:00:00');
  if (end < start) return; // validated properly at submit time

  let y = end.getFullYear() - start.getFullYear();
  let m = end.getMonth()    - start.getMonth();
  let d = end.getDate()     - start.getDate();
  if (d < 0) { m--; d += new Date(end.getFullYear(), end.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }

  const yEl = document.getElementById('tsk-tf-y');
  const mEl = document.getElementById('tsk-tf-m');
  const dEl = document.getElementById('tsk-tf-d');
  if (yEl) yEl.value = y || '';
  if (mEl) mEl.value = m || '';
  if (dEl) dEl.value = d || '';
}

function submitTask() {
  const nameEl = document.getElementById('tsk-name');
  if (!nameEl) return;
  const name = nameEl.value.trim();
  if (!name) { showAlert('Name is required.', 'Missing Field', 'error'); return; }

  if (selectedTaskStartDate && selectedTaskEndDate) {
    const s = new Date(selectedTaskStartDate + 'T12:00:00');
    const e = new Date(selectedTaskEndDate   + 'T12:00:00');
    if (e < s) {
      showAlert('End Date cannot be earlier than Start Date.', 'Invalid Date Range', 'error');
      return;
    }
  }

  const tfY = parseInt(document.getElementById('tsk-tf-y')?.value || '0') || 0;
  const tfM = parseInt(document.getElementById('tsk-tf-m')?.value || '0') || 0;
  const tfD = parseInt(document.getElementById('tsk-tf-d')?.value || '0') || 0;
  const tfTotal = tfY + tfM + tfD;

  const { refId, action } = mCtx;
  const data = {
    name,
    desc:      document.getElementById('tsk-desc')?.value.trim() || '',
    timeframe: tfTotal > 0 ? { y: tfY||null, m: tfM||null, d: tfD||null } : null,
    startDate: selectedTaskStartDate || null,
    endDate:   selectedTaskEndDate   || null,
    priority:  document.getElementById('tsk-pri')?.value || null,
  };
  // Link-to-Goal field only exists in the form for top-level Tasks (not
  // Sub-tasks) — only touch linkedGoalId when that field was actually shown.
  const linkGoalEl = document.getElementById('tsk-link-goal');
  if (linkGoalEl) data.linkedGoalId = linkGoalEl.value || null;

  if (action === '_edit') {
    Object.assign(S.tasks.find(x => x.id === refId), data);
  } else {
    const parentId = action === 'subtask' ? refId : null;
    const type = action === 'subtask' ? 'subtask' : 'task';
    const siblings = S.tasks.filter(x => (x.parentId||null) === parentId);
    const maxOrder = siblings.length ? Math.max(...siblings.map(x => x.order||0)) : -1;
    S.tasks.push({
      id: uid(), type, parentId, createdAt: Date.now(), order: maxOrder + 1,
      linkedGoalId: null, ...data
    });
  }
  save(); closeModal(); renderTasksPage();
}

// ── DAILY PLANNER STATE ─────────────────────────────────────────────────
function todayStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}
let plannerDate = todayStr();   // the currently selected day in the planner
let stripAnchor = todayStr();   // first visible day of the 7-day strip
let selectedDailyDate = null;   // used by the modal's calendar

function parseDate(s) { return new Date(s + 'T12:00:00'); }
function addDays(dateStr, n) {
  const d = parseDate(dateStr); d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function startOfWeek(dateStr) {
  const d = parseDate(dateStr);
  const day = d.getDay(); // 0 = Sun
  d.setDate(d.getDate() - day);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function selectPlannerDate(dateStr) {
  plannerDate = dateStr;
  renderDateStrip();
  renderDaily();
}
function shiftWeek(n) {
  stripAnchor = addDays(stripAnchor, n * 7);
  renderDateStrip();
}
function jumpToToday() {
  stripAnchor = startOfWeek(todayStr());
  selectPlannerDate(todayStr());
}

function renderDateStrip() {
  const strip = document.getElementById('date-strip');
  if (!strip) return;
  const t = todayStr();
  const dowShort = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mNames = _monthNames(true);

  let html = '';
  for (let i = 0; i < 7; i++) {
    const dateStr = addDays(stripAnchor, i);
    const disp = _gregToDisplay(dateStr);
    const rawDate = parseDate(dateStr);
    const hasTasks = S.daily.some(task => task.date === dateStr);
    const cls = ['ds-cell'];
    if (dateStr === plannerDate) cls.push('selected');
    if (dateStr === t) cls.push('is-today');
    html += `<div class="${cls.join(' ')}" onclick="selectPlannerDate('${dateStr}')">
      <span class="ds-dow">${dowShort[rawDate.getDay()]}</span>
      <span class="ds-num">${disp.d}</span>
      <span class="ds-mon">${mNames[disp.m - 1]}</span>
      ${hasTasks ? '<span class="ds-dot"></span>' : ''}
    </div>`;
  }
  strip.innerHTML = html;

  // update header label
  const label = document.getElementById('ds-label');
  const sub   = document.getElementById('ds-sublabel');
  if (label && sub) {
    const monthNamesFull = _monthNames(false);
    const dowFull = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const disp    = _gregToDisplay(plannerDate);
    const rawDate = parseDate(plannerDate);
    let prefix = '';
    if (plannerDate === t) prefix = 'Today';
    else if (plannerDate === addDays(t, 1)) prefix = 'Tomorrow';
    else if (plannerDate === addDays(t, -1)) prefix = 'Yesterday';
    else prefix = dowFull[rawDate.getDay()];
    label.firstChild.textContent = prefix;
    sub.textContent = `${monthNamesFull[disp.m - 1]} ${disp.d}, ${disp.y}`;
  }
}

// ── DAILY RENDER ──────────────────────────────────────────────────────────
let dailyFilter = 'all';
function setDailyFilter(f, el) {
  dailyFilter = f;
  document.querySelectorAll('#page-daily .pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderDaily();
}
function renderDaily() {
  renderDailyStats();
  renderDateStrip();

  const today = todayStr();
  const isToday = plannerDate === today;
  const isPast  = plannerDate < today;
  const isFuture = plannerDate > today;

  let items = S.daily.filter(t => t.date === plannerDate);
  const total = items.length;
  const done  = items.filter(t => t.done).length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  const bar = document.getElementById('daily-progress');
  if (bar) bar.style.width = pct + '%';

  if (dailyFilter === 'pending') items = items.filter(t => !t.done);
  else if (dailyFilter === 'done') items = items.filter(t => t.done);
  else if (['kill','mid','final','chill'].includes(dailyFilter)) items = items.filter(t => t.priority === dailyFilter);
  items.sort((a,b) => (a.done === b.done ? (a.order||0) - (b.order||0) : a.done ? 1 : -1));

  const routinesForDay = _routinesForDate(plannerDate);
  const activeRoutineCount = routinesForDay.length;

  const list = document.getElementById('daily-list');
  let html = '';

  if (isFuture && activeRoutineCount > 0) {
    html += `<div class="routine-banner" onclick="showPage('routines',null)">
      <span class="routine-banner-text">You have <strong>${activeRoutineCount} routine${activeRoutineCount>1?'s':''}</strong> scheduled for this day.</span>
      <span class="routine-banner-arrow">View Routines →</span>
    </div>`;
  }

  if ((isToday || isPast) && activeRoutineCount > 0 && dailyFilter === 'all') {
    html += routinesForDay.map(r => routineDailyItemHTML(r, plannerDate)).join('');
  }

  if (!items.length && html === '') {
    list.innerHTML = `<div class="empty"><div class="empty-icon">[ ]</div><div class="empty-text">Nothing planned for this day — add a task above.</div></div>`;
    return;
  }
  html += items.map(t => dailyItemHTML(t)).join('');
  list.innerHTML = html;
}

// ── CASCADE TYPE DOWNGRADE ────────────────────────────────────────────────
// Type rank: long=0, medium=1, short=2 (Goals are a 3-level hierarchy only —
// Tasks/Sub-tasks live in their own section and link to a goal by reference,
// not by structural nesting, so they're unaffected by this cascade).
const TYPE_RANK = { long: 0, medium: 1, short: 2 };

function _cascadeTypeDowngrade(parentId, parentType) {
  const directChildren = S.goals.filter(g => g.parentId === parentId);
  if (!directChildren.length) return;

  const maxAllowedRank = TYPE_RANK[parentType] + 1; // children must be at least one rank lower

  directChildren.forEach(child => {
    if (TYPE_RANK[child.type] < maxAllowedRank) {
      // child's current type is "too high" — must downgrade it
      // find the right type: one step below the parent
      const newChildType = Object.keys(TYPE_RANK).find(
        t => TYPE_RANK[t] === maxAllowedRank
      );
      if (newChildType && newChildType !== child.type) {
        child.type = newChildType;
      }
    }
    // recurse into this child's children
    _cascadeTypeDowngrade(child.id, child.type);
  });
}

function submitGoal() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { showAlert('Name is required.', 'Missing Field', 'error'); return; }

  const type = document.getElementById('f-type').value;

  const tfY = parseInt(document.getElementById('f-tf-y').value) || 0;
  const tfM = parseInt(document.getElementById('f-tf-m').value) || 0;
  const tfD = parseInt(document.getElementById('f-tf-d').value) || 0;
  const tfTotal = tfY + tfM + tfD;

  if (tfTotal === 0) {
    showAlert('Timeframe is required — enter at least one value (Years, Months, or Days).', 'Missing Field', 'error');
    return;
  }

  const { refId, action } = mCtx;

  const data = {
    name,
    desc:      document.getElementById('f-desc').value.trim(),
    timeframe: { y: tfY||null, m: tfM||null, d: tfD||null },
    date:      selectedGoalDate || null,
  };

  if (action === '_edit') {
    const goal = S.goals.find(x => x.id === refId);
    const oldType = goal.type;
    Object.assign(goal, data, { type });
    // cascade downgrade if the new type is lower than the old one
    if (oldType !== type) _cascadeTypeDowngrade(refId, type);
  }
  else {
    const siblings = S.goals.filter(x => (x.parentId||null) === (action ? refId : null));
    const maxOrder = siblings.length ? Math.max(...siblings.map(x => x.order||0)) : -1;
    S.goals.push({ id: uid(), type, parentId: action ? refId : null, createdAt: Date.now(), order: maxOrder + 1, ...data });
  }
  save(); closeModal(); renderGoals();
}

let _cmTaskId   = null;

function openCopyMoveModal(taskId, action, isRoutine) {
  _cmTaskId     = taskId;
  _cmAction     = action;
  _cmTargetDate = null;
  _cmIsRoutine  = !!isRoutine;
  _cmRoutineDate = isRoutine ? plannerDate : null;

  let name;
  if (isRoutine) {
    const effective = _routineDataForDay(taskId, plannerDate);
    if (!effective) return;
    name = effective.name;
  } else {
    const task = S.daily.find(t => t.id === taskId);
    if (!task) return;
    name = task.name;
  }

  const title = action === 'copy' ? 'Copy to Another Day' : 'Move to Another Day';
  const verb  = action === 'copy' ? 'Copy' : 'Move';

  document.getElementById('m-title').textContent = title;
  document.getElementById('m-body').innerHTML = `
    <div class="f-group" style="margin-bottom:6px">
      <label class="f-label">${isRoutine ? 'Routine' : 'Task'}</label>
      <div style="font-size:14px;font-weight:600;color:var(--ink);padding:6px 0">${esc(name)}</div>
    </div>
    ${isRoutine ? `<div style="font-family:var(--font-mono);font-size:10px;color:var(--ink3);margin-bottom:14px;padding:8px;border:1px solid var(--rule2);background:var(--bg2)">
      ${action==='copy' ? 'Creates a one-off task on the target day.' : 'Removes this routine from today and adds a one-off task on the target day.'}
    </div>` : ''}
    <div class="f-group">
      <label class="f-label">Target Date <em>*</em></label>
      <div class="cal-wrap" id="cm-cal-wrap"></div>
    </div>`;
  document.getElementById('m-foot').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="submitCopyMove()">${verb}</button>`;

  document.getElementById('overlay').classList.add('open');
  initCalendar('cm-cal-wrap', null, d => { _cmTargetDate = d; });
}

function submitCopyMove() {
  if (!_cmTargetDate) {
    showAlert('Please select a target date.', 'Missing Date', 'error');
    return;
  }

  if (_cmIsRoutine) {
    const effective = _routineDataForDay(_cmTaskId, _cmRoutineDate);
    if (!effective) return;
    const maxOrder = S.daily.length ? Math.max(...S.daily.map(x => x.order||0)) : -1;
    S.daily.push({
      id: uid(), date: _cmTargetDate, done: false, createdAt: Date.now(), order: maxOrder + 1,
      name: effective.name, desc: effective.desc || '',
      priority: effective.priority || null, linkedTaskId: effective.linkedId || null
    });
    if (_cmAction === 'move') {
      S.routineExceptions.push({ routineId: _cmTaskId, date: _cmRoutineDate });
    }
    showAlert(
      `"${esc(effective.name)}" ${_cmAction === 'copy' ? 'copied' : 'moved'} to ${_fmtDateShort(_cmTargetDate)} as a one-off task.`,
      _cmAction === 'copy' ? 'Routine Copied' : 'Routine Moved', 'info'
    );
    save(); closeModal(); renderDaily();
    return;
  }

  const task = S.daily.find(t => t.id === _cmTaskId);
  if (!task) return;

  if (_cmAction === 'copy') {
    const maxOrder = S.daily.length ? Math.max(...S.daily.map(x => x.order||0)) : -1;
    S.daily.push({
      ...task,
      id: uid(),
      date: _cmTargetDate,
      done: false,
      createdAt: Date.now(),
      order: maxOrder + 1
    });
    showAlert(
      `"${esc(task.name)}" copied to ${_fmtDateShort(_cmTargetDate)}.`,
      'Task Copied', 'info'
    );
  } else {
    task.date = _cmTargetDate;
    showAlert(
      `"${esc(task.name)}" moved to ${_fmtDateShort(_cmTargetDate)}.`,
      'Task Moved', 'info'
    );
  }
  save();
  closeModal();
  renderDaily();
}

// Generates <optgroup> HTML for linking to any Goal/Task/Sub-task, grouped by type
// Generates <optgroup> HTML for linking a TASK to a Goal (Long/Medium/Short
// only — not other Tasks/Sub-tasks, per the Task-to-Goal linking requirement)
function _goalOnlyOptionsHTML(selectedId) {
  const groups = [
    { key: 'long',   label: 'Long-term Goals' },
    { key: 'medium', label: 'Medium-term Goals' },
    { key: 'short',  label: 'Short-term Goals' },
  ];
  return groups.map(grp => {
    const items = S.goals.filter(g => g.type === grp.key).sort((a,b)=>(a.order||0)-(b.order||0));
    if (!items.length) return '';
    return `<optgroup label="${grp.label}">
      ${items.map(g => `<option value="${g.id}"${selectedId===g.id?' selected':''}>${esc(g.name)}</option>`).join('')}
    </optgroup>`;
  }).join('');
}

// Finds a linked item by id across BOTH S.goals (long/medium/short) and
// S.tasks (task/subtask) — a linked id can point into either array now that
// Tasks/Sub-tasks live separately from the Goals hierarchy.
function _findLinkedItem(id) {
  if (!id) return null;
  return S.goals.find(g => g.id === id) || S.tasks.find(t => t.id === id) || null;
}

function _linkableOptionsHTML(selectedId) {
  const goalGroups = [
    { key: 'long',    label: 'Long-term Goals' },
    { key: 'medium',  label: 'Medium-term Goals' },
    { key: 'short',   label: 'Short-term Goals' },
  ];
  const taskGroups = [
    { key: 'task',    label: 'Tasks' },
    { key: 'subtask', label: 'Sub-tasks' },
  ];
  const goalHTML = goalGroups.map(grp => {
    const items = S.goals.filter(g => g.type === grp.key).sort((a,b)=>(a.order||0)-(b.order||0));
    if (!items.length) return '';
    return `<optgroup label="${grp.label}">
      ${items.map(g => `<option value="${g.id}"${selectedId===g.id?' selected':''}>${esc(g.name)}</option>`).join('')}
    </optgroup>`;
  }).join('');
  const taskHTML = taskGroups.map(grp => {
    const items = S.tasks.filter(t => t.type === grp.key).sort((a,b)=>(a.order||0)-(b.order||0));
    if (!items.length) return '';
    return `<optgroup label="${grp.label}">
      ${items.map(t => `<option value="${t.id}"${selectedId===t.id?' selected':''}>${esc(t.name)}</option>`).join('')}
    </optgroup>`;
  }).join('');
  return goalHTML + taskHTML;
}

function previewDailyPri(val, targetId) {
  const el = document.getElementById(targetId || 'df-pri-preview');
  if (!el) return;
  if (!val || !D_PRI[val]) { el.textContent = ''; return; }
  el.className = 'f-pri-preview ' + D_PRI[val].cls;
  el.textContent = '▸ ' + D_PRI[val].label;

function submitDaily() {
  const name = document.getElementById('df-name').value.trim();

function setCalSystem(sys) {
  calSystem = sys;
  S.calSystem = sys;
  save();

  ['gregorian','shamsi','hijri'].forEach(s => {
    const btn = document.getElementById('csbtn-' + s);
    if (btn) btn.classList.toggle('active', s === sys);

// ── GREGORIAN ↔ SHAMSI (Solar Hijri / Persian) ─────────────────────────────
// jalaali-js algorithm (MIT), accurate 1800–2100, ±0 days
function _gToShamsi(gy, gm, gd) {
  var jy2=gy-1600,jm2=gm-1,jd2=gd-1;
  var g_d_no=365*jy2+Math.floor((jy2+3)/4)-Math.floor((jy2+99)/100)+Math.floor((jy2+399)/400);
  var leap=(gy%4===0&&gy%100!==0)||gy%400===0;
  var gdays=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  for(var i=0;i<jm2;i++) g_d_no+=gdays[i];
  g_d_no+=jd2;
  var j_day_no=g_d_no-79;
  var j_np=Math.floor(j_day_no/12053); j_day_no%=12053;
  var jy3=979+33*j_np+4*Math.floor(j_day_no/1461);
  j_day_no%=1461;
  if(j_day_no>=366){jy3+=Math.floor((j_day_no-1)/365);j_day_no=(j_day_no-1)%365;}
  var jmonths=[31,31,31,31,31,31,30,30,30,30,30,29];
  var jm3=0;
  for(var k=0;k<11&&j_day_no>=jmonths[k];k++) j_day_no-=jmonths[k]; jm3=k;
  return{y:jy3,m:jm3+1,d:j_day_no+1};
}
function _shamsiToG(jy,jm,jd) {
  var jy1=jy-979,jm1=jm-1,jd1=jd-1;
  var j_day_no=365*jy1+Math.floor(jy1/33)*8+Math.floor((jy1%33+3)/4);
  var jmonths=[31,31,31,31,31,31,30,30,30,30,30,29];
  for(var i=0;i<jm1;i++) j_day_no+=jmonths[i];
  j_day_no+=jd1;
  var g_day_no=j_day_no+79;
  var gy=1600+400*Math.floor(g_day_no/146097); g_day_no%=146097;
  var leap=true;
  if(g_day_no>=36525){g_day_no--;gy+=100*Math.floor(g_day_no/36524);g_day_no%=36524;if(g_day_no>=365)g_day_no++;else leap=false;}
  gy+=4*Math.floor(g_day_no/1461); g_day_no%=1461;
  if(g_day_no>=366){leap=false;g_day_no--;gy+=Math.floor(g_day_no/365);g_day_no%=365;}
  var gdays=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  var gm2=0;
  for(var j=0;g_day_no>=gdays[j];j++) g_day_no-=gdays[j]; gm2=j;
  return{y:gy,m:gm2+1,d:g_day_no+1};
}

// ── GREGORIAN ↔ HIJRI LUNAR (Tabular, moment-hijri algorithm) ──────────────
// Accurate ±1 day vs Umm al-Qura (Islamic lunar is inherently observational)
function _g2jdnH(y,m,d) {
  var a=Math.floor((14-m)/12),y2=y+4800-a,m2=m+12*a-3;
  return d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;
}
function _gToHijri(gy,gm,gd) {
  var jdn=_g2jdnH(gy,gm,gd);
  var l=jdn-1948440+10632,n=Math.floor((l-1)/10631);
  l=l-10631*n+354;
  var j=Math.floor((10985-l)/5316)*Math.floor((50*l)/17719)+Math.floor(l/5670)*Math.floor((43*l)/15238);
  l=l-Math.floor((30-j)/15)*Math.floor((17719*j)/50)-Math.floor(j/16)*Math.floor((15238*j)/43)+29;
  var m2=Math.floor((24*l)/709),d2=l-Math.floor((709*m2)/24),y2=30*n+j-30;
  return{y:y2,m:m2,d:d2};
}
function _hijriToG(hy,hm,hd) {
  var n=Math.floor((11*hy+3)/30)+354*hy+30*hm-Math.floor((hm-1)/2)+hd+1948440-385;
  var jdn=n;
  var l=jdn+68569,q=Math.floor(4*l/146097);
  l=l-Math.floor((146097*q+3)/4);
  var i=Math.floor(4000*(l+1)/1461001);
  l=l-Math.floor(1461*i/4)+31;
  var j=Math.floor(80*l/2447),gd2=l-Math.floor(2447*j/80);
  l=Math.floor(j/11);var gm2=j+2-12*l,gy2=100*(q-49)+i+l;
  return{y:gy2,m:gm2,d:gd2};
}

// ── UNIFIED DATE CONVERSION HELPERS ────────────────────────────────────────
// Convert a Gregorian YYYY-MM-DD string → display object for the active calendar
function _gregToDisplay(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T12:00:00');
  const gy = d.getFullYear(), gm = d.getMonth() + 1, gd = d.getDate();
  if (calSystem === 'shamsi') return _gToShamsi(gy, gm, gd);
  if (calSystem === 'hijri')  return _gToHijri(gy, gm, gd);
  return { y: gy, m: gm, d: gd };
}

// Convert a display-calendar date {y,m,d} → Gregorian YYYY-MM-DD string
function _displayToGreg(y, m, d) {
  let gy, gm, gd;
  if (calSystem === 'shamsi') { const r = _shamsiToG(y,m,d); gy=r.y; gm=r.m; gd=r.d; }
  else if (calSystem === 'hijri') { const r = _hijriToG(y,m,d); gy=r.y; gm=r.m; gd=r.d; }
  else { gy=y; gm=m; gd=d; }
  return `${gy}-${String(gm).padStart(2,'0')}-${String(gd).padStart(2,'0')}`;
}

// Number of days in a given display-calendar month
function _daysInMonth(y, m) {
  if (calSystem === 'shamsi') {
    if (m <= 6) return 31;
    if (m <= 11) return 30;
    // month 12: 29 normally, 30 in leap years (divisible by 4 approx)
    return (y % 4 === 1) ? 30 : 29;
  }
  if (calSystem === 'hijri') {
    return (m % 2 !== 0 || m === 12) ? 30 : 29;
  }
  return new Date(y, m, 0).getDate(); // Gregorian
}

// First weekday (0=Sun) of a display-calendar month
function _firstDayOfMonth(y, m) {
  const gregStr = _displayToGreg(y, m, 1);
  return new Date(gregStr + 'T12:00:00').getDay();
}

// today as display-calendar {y, m, d}
function _todayDisplay() {
  const t = new Date();
  return _gregToDisplay(`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`);
}

// month names per calendar system
function _monthNames(short) {
  if (calSystem === 'shamsi') {
    const full = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
    return short ? full.map(m => m.slice(0,3)) : full;
  }
  if (calSystem === 'hijri') {
    const full = ['محرم','صفر','ربیع الأول','ربیع الثاني','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
    return short ? full.map(m => m.slice(0,4)) : full;
  }
  return short
    ? ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
    : ['January','February','March','April','May','June','July','August','September','October','November','December'];
}

// weekday labels per calendar system (always 7, starting Sun)
function _dowLabels() {
  if (calSystem === 'shamsi' || calSystem === 'hijri') {
    return ['ی','د','س','چ','پ','ج','ش']; // Yekshanbeh…Shanbeh / Sun…Sat in Persian order mapped to Sun-start
  }
  return ['Su','Mo','Tu','We','Th','Fr','Sa'];
}
